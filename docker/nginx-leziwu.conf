server {
    listen 80;
    listen [::]:80;
    server_name leziwu.com www.leziwu.com app.leziwu.com;

    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;

    # Internet scanners otherwise fall through to the SPA route, where every
    # fake PHP/WordPress path creates a Python request and an auth redirect.
    # Reject them at nginx so real page/API requests retain the CPU budget.
    location ~* \.(?:php[0-9]?|phtml|asp|aspx|jsp|cgi)(?:/|$) {
        access_log off;
        return 404;
    }

    location ~* ^/(?:wp-admin|wp-content|wp-includes|\.env|\.git|vendor/phpunit|xmlrpc\.php)(?:/|$) {
        access_log off;
        return 404;
    }

    # Keep a small host-served recovery page available while the application
    # container is starting or being automatically repaired.
    error_page 502 503 504 /__service_waiting.html;

    location = /__service_waiting.html {
        internal;
        root /var/www/leziwu-system;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        # The deploy step publishes the content-hashed Vite bundle to this
        # host directory atomically. A missing release safely falls back to
        # the application container during first install or rollback.
        root /var/www/leziwu-static;
        try_files $uri @app_assets;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location @app_assets {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 32k;
        proxy_intercept_errors on;
    }
}
