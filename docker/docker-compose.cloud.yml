services:
  server:
    env_file:
      - ../.env
      - ../cloud-config/.env
    volumes:
      - ../cloud-config:/app/config
      - ../tyc-config:/home/dsa/.tyc
    environment:
      - API_PORT=8000
      - API_STARTUP_TIMEOUT_SECONDS=120
      - WEBUI_HOST=0.0.0.0
      - DATABASE_PATH=/app/data/stock_analysis.db
      - ENV_FILE=/app/config/.env
      - MAX_WORKERS=1
      - INVESTMENT_MONITOR_MAX_WORKERS=1
      - INVESTMENT_MONITOR_POLL_SEC=15
      - INVESTMENT_MONITOR_NEWS_LIVE_OVERLAP_MINUTES=10
      - INVESTMENT_MONITOR_NEWS_OVERLAP_MINUTES=360
      - MARKET_TICK_POLL_SECONDS=60
      # The persistent cloud database already contains historical bars. Avoid
      # reloading years of history after every container restart; newly added
      # symbols still trigger their own incremental bootstrap.
      - MARKET_STARTUP_BOOTSTRAP_ENABLED=false
      - MARKET_INTRADAY_SESSIONS=5
      - MARKET_DAILY_HISTORY_DAYS=730
      - ZSXQ_MCP_POLL_SEC=10
      - ZSXQ_MCP_MAX_PAGES_PER_SYNC=3
      - ESSAY_ANALYSIS_POLL_SEC=5
      - CNINFO_WATCHLIST_POLL_SEC=60
      - CNINFO_WATCHLIST_HISTORY_DAYS=365
      - CNINFO_WATCHLIST_WINDOWS_PER_CYCLE=1
      - SYNC_WATCHDOG_INTERVAL_SEC=120
      - SYNC_WATCHDOG_STALE_MULTIPLIER=12
      - APP_STARTUP_WARMUP=false
      - APP_STARTUP_WARMUP_PROFILE=essential
      - APP_STARTUP_WARMUP_DELAY_SECONDS=4
      - SQLITE_CACHE_SIZE_KIB=32768
      - SQLITE_MMAP_SIZE_MB=128
      # Data adapters create short-lived Pandas/HTTP buffers. Limit glibc arena
      # fragmentation and return large freed blocks sooner on small instances.
      - MALLOC_ARENA_MAX=2
      - MALLOC_TRIM_THRESHOLD_=131072
      - USER_SESSION_CACHE_SECONDS=30
      - ESSAY_QUANT_AUTO_START=false
      - DATA_STORAGE_MAINTENANCE_AUTO_START=false
      - SYNC_WATCHDOG_AUTO_START=true
      - ICLOUD_KNOWLEDGE_AUTO_START=false
    deploy:
      resources:
        limits:
          # The first catch-up pass can briefly exceed 1.1 GiB while a single
          # upstream client materializes a full-market response.  Keep worker
          # concurrency at one, but leave enough cgroup headroom to use the
          # host's configured swap instead of entering a restart loop.
          memory: 1400M
        reservations:
          memory: 512M
