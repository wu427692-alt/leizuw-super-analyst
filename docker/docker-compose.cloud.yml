services:
  server:
    # The website is the highest-priority workload on the small cloud host.
    # Prefer restarting/slowdown of collectors over losing request serving.
    oom_score_adj: -500
    env_file:
      - ../.env
      - ../cloud-config/.env
    volumes:
      - ../cloud-config:/app/config
      - ../tyc-config:/home/dsa/.tyc
    environment:
      - API_PORT=8000
      - API_STARTUP_TIMEOUT_SECONDS=120
      - WEBUI_HOST=0.0.0.0
      # Cloud deployments must fail closed even if a local .env is missing or stale.
      - USER_ACCESS_ENABLED=true
      - ADMIN_AUTH_ENABLED=true
      - DATABASE_PATH=/app/data/stock_analysis.db
      - ENV_FILE=/app/config/.env
      - MAX_WORKERS=1
      # The full-channel poller runs in monitor-worker.  Keep request serving
      # isolated so a large upstream payload can never take the website down.
      - INVESTMENT_MONITOR_AUTO_START=false
      - INVESTMENT_MONITOR_RUN_MODE=external
      - INVESTMENT_MONITOR_MAX_WORKERS=1
      - ESSAY_ANALYSIS_CONCURRENCY=1
      - DATA_ACQUISITION_MAX_WORKERS=1
      - ESSAY_QUANT_PRICE_WORKERS=1
      - GENERATION_BACKEND_MAX_CONCURRENCY=1
      - LOCAL_CLI_BACKEND_MAX_CONCURRENCY=1
      - INVESTMENT_MONITOR_POLL_SEC=15
      - INVESTMENT_MONITOR_NEWS_LIVE_OVERLAP_MINUTES=10
      - INVESTMENT_MONITOR_NEWS_OVERLAP_MINUTES=360
      - MARKET_TICK_POLL_SECONDS=60
      # The persistent cloud database already contains historical bars. Avoid
      # reloading years of history after every container restart; newly added
      # symbols still trigger their own incremental bootstrap.
      - MARKET_STARTUP_BOOTSTRAP_ENABLED=false
      - MARKET_INTRADAY_SESSIONS=5
      - MARKET_DAILY_HISTORY_DAYS=730
      - ZSXQ_MCP_POLL_SEC=10
      - ZSXQ_MCP_MAX_PAGES_PER_SYNC=3
      - ESSAY_ANALYSIS_POLL_SEC=5
      - CNINFO_WATCHLIST_POLL_SEC=60
      - CNINFO_WATCHLIST_HISTORY_DAYS=365
      - CNINFO_WATCHLIST_WINDOWS_PER_CYCLE=1
      - SYNC_WATCHDOG_INTERVAL_SEC=120
      - SYNC_WATCHDOG_STALE_MULTIPLIER=12
      # Warm only lightweight, indexed first-page views after the API is
      # already listening. Heavy dashboards stay lazy and cache-backed.
      - APP_STARTUP_WARMUP=true
      - APP_STARTUP_WARMUP_PROFILE=essential
      - APP_STARTUP_WARMUP_DELAY_SECONDS=10
      - SQLITE_CACHE_SIZE_KIB=16384
      - SQLITE_MMAP_SIZE_MB=0
      # Data adapters create short-lived Pandas/HTTP buffers. Limit glibc arena
      # fragmentation and return large freed blocks sooner on small instances.
      - MALLOC_ARENA_MAX=2
      - MALLOC_TRIM_THRESHOLD_=131072
      - MALLOC_MMAP_THRESHOLD_=131072
      - PYTHONMALLOC=malloc
      # Console and Docker logs already retain production diagnostics. Avoid a
      # second 200 MB debug-log copy on the small system disk.
      - APP_DEBUG_FILE_LOG_ENABLED=false
      - APP_LOG_RETENTION_DAYS=14
      # Bound large ORM-derived insight caches on the 4 GB host. A miss only
      # recomputes the requested window; no feature or historical range is removed.
      - ESSAY_DASHBOARD_ROWS_CACHE_MAX_ENTRIES=2
      - ESSAY_DEEP_INSIGHTS_CACHE_MAX_ENTRIES=4
      - ESSAY_SUMMARY_CACHE_MAX_ENTRIES=16
      - USER_SESSION_CACHE_SECONDS=30
      - ESSAY_QUANT_AUTO_START=false
      # Concept exposure calculation can scan broad themes and consume a full
      # CPU core. Run it in the throttled collector container so page requests
      # keep their own CPU/GIL budget.
      - CONCEPT_THEME_AUTO_START=false
      - CONCEPT_THEME_RUN_MODE=external
      - DATA_STORAGE_MAINTENANCE_AUTO_START=false
      - SYNC_WATCHDOG_AUTO_START=true
      - ICLOUD_KNOWLEDGE_AUTO_START=false
    deploy:
      resources:
        limits:
          # Preserve enough CPU for SSH, nginx and the kernel even when a
          # user starts a large quant/data task on the 2-vCPU instance.
          cpus: "1.75"
          # The Hong Kong light server now provides 4 GB RAM (about 3.5 GiB
          # usable by Linux).  Give the application enough headroom for the
          # SQLite cache and large upstream payloads while reserving roughly
          # 700 MB for the kernel, Docker, SSH and the tunnel process.
          memory: 2200M
        reservations:
          memory: 768M

  monitor-worker:
    image: daily-stock-analysis-server
    container_name: stock-monitor-worker
    command: ["python", "-m", "src.services.investment_monitor_daemon"]
    restart: unless-stopped
    oom_score_adj: 500
    env_file:
      - ../.env
      - ../cloud-config/.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../reports:/app/reports
      - ../strategies:/app/strategies:ro
      - ../cloud-config:/app/config
      - ../tyc-config:/home/dsa/.tyc
      - ../longbridge_tokens:/home/dsa/.longbridge
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_PATH=/app/data/stock_analysis.db
      - ENV_FILE=/app/config/.env
      - INVESTMENT_MONITOR_AUTO_START=true
      - INVESTMENT_MONITOR_RUN_MODE=embedded
      - INVESTMENT_MONITOR_MAX_WORKERS=1
      - INVESTMENT_MONITOR_POLL_SEC=15
      - INVESTMENT_MONITOR_NEWS_LIVE_OVERLAP_MINUTES=10
      - INVESTMENT_MONITOR_NEWS_OVERLAP_MINUTES=360
      - CONCEPT_THEME_AUTO_START=true
      - CONCEPT_THEME_RUN_MODE=embedded
      - CONCEPT_THEME_SYNC_BATCH_SIZE=20
      - CONCEPT_THEME_SYNC_INTERVAL_SEC=1800
      - CONCEPT_THEME_WATCHLIST_INTERVAL_SEC=21600
      - SQLITE_CACHE_SIZE_KIB=8192
      - SQLITE_MMAP_SIZE_MB=0
      - MALLOC_ARENA_MAX=1
      - MALLOC_TRIM_THRESHOLD_=65536
      - MALLOC_MMAP_THRESHOLD_=65536
      - PYTHONMALLOC=malloc
      - APP_DEBUG_FILE_LOG_ENABLED=false
      - APP_LOG_RETENTION_DAYS=14
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 900M
        reservations:
          memory: 256M
