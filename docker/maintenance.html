<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="5">
  <title>乐子乌超级价值 · 服务恢复中</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #e8f4ff;
      background: radial-gradient(circle at 20% 15%, #103e78 0, transparent 35%),
                  radial-gradient(circle at 80% 80%, #072c54 0, transparent 34%), #030b18; }
    main { width: min(90vw, 620px); padding: 44px; border: 1px solid rgba(82,180,255,.28);
      border-radius: 24px; background: rgba(5,18,38,.82); box-shadow: 0 30px 90px rgba(0,0,0,.45); }
    .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px;
      font-weight: 800; color: #02101f; background: linear-gradient(135deg,#43e7ff,#56a2ff); }
    h1 { margin: 24px 0 10px; font-size: clamp(24px,5vw,38px); }
    p { margin: 0; color: #a8c3df; line-height: 1.8; }
    .line { height: 4px; margin-top: 30px; overflow: hidden; border-radius: 999px; background: #10243c; }
    .line::after { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg,#36dcff,#5f7dff); animation: move 1.2s ease-in-out infinite alternate; }
    small { display: block; margin-top: 18px; color: #6685a6; }
    @keyframes move { from { transform: translateX(-15%); } to { transform: translateX(155%); } }
  </style>
</head>
<body>
  <main>
    <div class="mark">乐</div>
    <h1>服务正在自动恢复</h1>
    <p>网页服务正在启动或自修复，当前页面会每 5 秒自动重试，不需要手动刷新。</p>
    <div class="line"></div>
    <small>乐子乌超级价值 · 可用性保护</small>
  </main>
</body>
</html>
