<!doctype html>
<html lang="zh-CN" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0F16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="乐子乌" />
    <meta name="application-name" content="乐子乌" />
    <script>
      (() => {
        const languageStorageKey = 'dsa.uiLanguage';
        const storageKey = 'theme';
        const root = document.documentElement;
        let storedLanguage = null;
        try {
          storedLanguage = localStorage.getItem(languageStorageKey);
        } catch {
          // The application will fall back to its in-memory language setting.
        }
        if (storedLanguage !== 'zh' && storedLanguage !== 'en') {
          const browserLanguages = [...(navigator.languages || []), navigator.language]
            .filter(Boolean)
            .map((value) => String(value).toLowerCase());
          storedLanguage = browserLanguages.find((value) => value.startsWith('zh'))
            ? 'zh'
            : browserLanguages.find((value) => value.startsWith('en'))
              ? 'en'
              : 'zh';
        }
        root.lang = storedLanguage === 'en' ? 'en' : 'zh-CN';
        root.setAttribute('translate', 'no');
        const storedTheme = localStorage.getItem(storageKey);
        const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'dark';
        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <title>乐子乌智能投研平台</title>
  </head>
  <body class="notranslate" translate="no">
    <div id="root"></div>
    <script defer src="/assets/account-access-navigation.js"></script>
    <script defer src="/assets/alphasift-explain.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
