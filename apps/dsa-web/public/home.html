<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>乐子乌 · 智能投研团队</title>
<style>
  /* 令牌与 apps/dsa-web/src/styles/design-tokens.css 保持一致；
     本页是独立构建的静态页，故内联同一套值。 */
  :root {
    color-scheme: light dark;
    --brand:#FF4F00; --brand-hover:var(--brand-hover); --brand-pressed:#E04600; --brand-on:var(--brand-on);
    --bg-0:#F4F5F7; --bg-1:var(--brand-on); --bg-2:#F1F3F6; --bg-3:#E9ECF1;
    --line-1:#E2E6EC; --line-2:#CDD4DE;
    --text-1:#0E1420; --text-2:#3A4555; --text-3:#5F6978; --text-4:#9AA3B0;
    --up:#D92D3A; --down:#0E8F55; --warning:#B54708; --danger:#D92D20;
    --success:#039855; --info:#1570EF;
    --radius-tag:4px; --radius-control:8px; --radius-card:12px; --radius-pill:9999px;
    --shadow-card:0 1px 2px rgb(16 24 40 / .06);
    --font-sans: Inter, "PingFang SC", "MiSans", "Microsoft YaHei", system-ui, sans-serif;

    /* 兼容本页原有变量名 */
    --ink:var(--text-1); --deep:var(--bg-0); --panel:var(--bg-1); --panel2:var(--bg-2);
    --line:var(--line-1); --text:var(--text-1); --muted:var(--text-3);
    --gold:var(--brand); --blue:var(--info); --green:var(--down); --purple:var(--info);
    --orange:var(--warning); --pink:var(--warning); --red:var(--danger);
    --accent:var(--brand);
    --shadow:none;
  }
  :root[data-theme="dark"] {

      --brand-text:var(--brand-hover);
      --bg-0:#07080B; --bg-1:#0C0F16; --bg-2:#121722; --bg-3:#1A2130;
      --line-1:#232B3A; --line-2:#2E3849;
      --text-1:#F2F5FA; --text-2:#A8B2C1; --text-3:#7C8798; --text-4:#55606F;
      --up:#F5333F; --down:#12B76A; --warning:#F79009; --danger:#F04438;
      --success:#12B76A; --info:#2E90FA;
      --shadow-card:0 1px 2px rgb(0 0 0 / .32);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --brand-text:var(--brand-hover);
      --bg-0:#07080B; --bg-1:#0C0F16; --bg-2:#121722; --bg-3:#1A2130;
      --line-1:#232B3A; --line-2:#2E3849;
      --text-1:#F2F5FA; --text-2:#A8B2C1; --text-3:#7C8798; --text-4:#55606F;
      --up:#F5333F; --down:#12B76A; --warning:#F79009; --danger:#F04438;
      --success:#12B76A; --info:#2E90FA;
      --shadow-card:0 1px 2px rgb(0 0 0 / .32);
    }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; overflow:hidden; color:var(--text);
    font-family:var(--font-sans);
    background:var(--deep);
    -webkit-font-smoothing:antialiased;
  }
  body::after { content:none; }
  .app { height:100vh; display:flex; flex-direction:column; }

  /* ---------- top ---------- */
  .top {
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:12px 18px; border-bottom:1px solid var(--line-1); background:var(--bg-1);
    box-shadow:0 4px 0 var(--line-2);
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo {
    width:44px; height:44px; display:grid; place-items:center;
    background:var(--gold); color:var(--brand-on); font-weight:700; font-size:20px;
    border: 1px solid var(--line-2); box-shadow: var(--shadow-card);
  }
  .brand h1 { margin:0; font-size:17px; letter-spacing: 0; text-shadow:2px 2px 0 #000; }
  .brand p { margin:3px 0 0; font-size:12px; color:var(--muted); letter-spacing: 0; }
  .top-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pixel-btn {
    display:inline-block; padding:8px 12px; background:var(--panel2); color:var(--text);
    border: 1px solid var(--line-2); box-shadow: var(--shadow-card); text-decoration:none;
    font-size:12px; font-weight:700; letter-spacing: 0; cursor:pointer;
  }
  .pixel-btn:hover { background:var(--line-1); }
  .pixel-btn.gold { background:var(--gold); color:var(--brand-on); }
  .pixel-btn:active { transform:translate(2px,2px); box-shadow: var(--shadow-card); }

  /* ---------- main ---------- */
  .main { flex:1; min-height:0; display:grid; grid-template-columns:210px minmax(0,38%) minmax(0,1fr); }
  .sessions { display:flex; flex-direction:column; min-height:0; border-right: 1px solid var(--line-2); background:var(--bg-1); }
  .sessions-head { padding:9px; border-bottom: 1px solid var(--line-2); }
  .sessions-new { width:100%; padding:7px 8px; background:var(--line-2); border: 1px solid var(--line-2); color:var(--text); font:inherit; font-size:12px; cursor:pointer; text-align:left; }
  .sessions-new:hover { background:var(--line-2); }
  .sessions-search { width:100%; margin-top:6px; padding:5px 6px; background:var(--bg-2); border: 1px solid var(--line-2); color:var(--text); font:inherit; font-size:12px; box-sizing:border-box; }
  .sessions-filters { display:flex; gap:3px; margin-top:5px; }
  .sessions-filters button { flex:1; padding:3px 2px; background:var(--bg-2); border:1px solid var(--line-2); color:var(--muted); font:inherit; font-size:12px; cursor:pointer; }
  .sessions-filters button.on { border-color:var(--gold); color:var(--gold); }
  .sessions-tools { display:flex; gap:4px; margin-top:5px; }
  .sessions-tools button { flex:1; padding:3px 2px; background:var(--bg-2); border:1px solid var(--line-2); color:var(--muted); font:inherit; font-size:12px; cursor:pointer; }
  .sessions-tools button:hover { border-color:var(--gold); color:var(--gold); }
  .ws-files { position:absolute; left:210px; top:0; bottom:0; width:300px; z-index:20; background:var(--bg-1); border-right: 1px solid var(--line-2); box-shadow: none; display:flex; flex-direction:column; }
  .ws-files[hidden] { display:none; }
  .ws-files-head { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-bottom: 1px solid var(--line-2); font-size:12px; color:var(--gold); }
  .ws-files-head button { background:none; border:0; color:var(--muted); font:inherit; font-size:14px; cursor:pointer; }
  .ws-files-list { flex:1; overflow:auto; padding:8px; display:flex; flex-direction:column; gap:5px; }
  .ws-file { padding:6px; background:var(--bg-2); border: 1px solid var(--line-1); font-size:12px; color:var(--text); text-decoration:none; display:block; }
  .ws-file:hover { border-color:var(--gold); }
  .ws-file span { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .sessions-list { flex:1; min-height:0; overflow:auto; padding:7px; display:flex; flex-direction:column; gap:5px; }
  .session-item { position:relative; padding:7px 8px; background:var(--bg-2); border: 1px solid var(--line-1); cursor:pointer; }
  .session-item:hover { border-color:var(--line-2); }
  .session-item.active { border-color:var(--gold); background:var(--bg-2); }
  .session-item .st { display:flex; justify-content:space-between; gap:6px; font-size:12px; color:var(--muted); }
  .session-item .tt { font-size:12px; color:var(--text); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .session-item .dot { width:6px; height:6px; border-radius:0; display:inline-block; background:var(--text-3); }
  .session-item.running .dot { background:var(--blue); animation:blink 1s steps(2) infinite; }
  .session-item.done .dot { background:var(--green); }
  .session-item.failed .dot { background:var(--red); }
  .session-item.waiting_input .dot { background:var(--gold); }
  .session-item .acts { position:absolute; right:4px; top:4px; display:none; gap:2px; }
  .session-item:hover .acts { display:flex; }
  .session-item .acts button { background:var(--bg-2); border:1px solid var(--line-2); color:var(--muted); font:inherit; font-size:12px; cursor:pointer; padding:1px 4px; }
  .room-wrap { position:relative; min-height:0; overflow:hidden; border-right: 1px solid var(--line-2); display:flex; flex-direction:column; }
  .room {
    position:relative; flex:1; min-height:0; overflow:hidden;
    background:
      linear-gradient(180deg,var(--bg-2) 0%,var(--bg-2) 55%,var(--line-2) 100%);
  }
  .stars {
    position:absolute; inset:0 0 40% 0;
    background-image:
      radial-gradient(2px 2px at 12% 18%, #fff, transparent),
      radial-gradient(2px 2px at 28% 8%, var(--info), transparent),
      radial-gradient(1px 1px at 41% 22%, #fff, transparent),
      radial-gradient(2px 2px at 63% 12%, var(--warning), transparent),
      radial-gradient(1px 1px at 76% 26%, #fff, transparent),
      radial-gradient(2px 2px at 88% 9%, var(--info), transparent);
    opacity:.7;
  }
  .window {
    position:absolute; left:7%; right:7%; top:3%; height:52%;
    background:
      linear-gradient(180deg,var(--line-2),var(--bg-2) 70%);
    border:5px solid var(--line-1);
    box-shadow:0 0 0 4px var(--line-2), inset 0 0 40px rgba(91,157,255,.12);
    z-index:2;
  }
  .window::before { display:none; }
  .board { position:absolute; inset:0; display:flex; flex-direction:column; background:rgba(3,10,18,.9); }
  .board-head { display:flex; justify-content:space-between; align-items:center; padding:7px 12px; border-bottom: 1px solid var(--line-2); font-size:12px; color:var(--gold); letter-spacing: 0; }
  .board-body { flex:1; min-height:0; padding:8px 10px; overflow:auto; }
  .board-empty { color:var(--muted); font-size:12px; padding:18px 8px; text-align:center; }
  .board-table-wrap { height:100%; overflow:auto; }
  .board-table { width:100%; border-collapse:collapse; font-size:12px; }
  .board-table th, .board-table td { padding:4px 6px; border-bottom:1px solid var(--line-2); text-align:left; white-space:nowrap; max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  .board-table th { color:var(--gold); font-size:12px; position:sticky; top:0; background: var(--bg-2); }
  .board-chart { height:100%; display:flex; flex-direction:column; }
  .board-chart svg { flex:1; width:100%; min-height:0; }
  .board-chart-foot { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; padding:2px 4px; }
  .board-bars { display:flex; flex-direction:column; gap:6px; padding:4px; }
  .board-bar { display:grid; grid-template-columns:110px 1fr 48px; gap:8px; align-items:center; font-size:12px; }
  .board-bar-track { height:14px; background:var(--bg-2); border: 1px solid var(--line-2); }
  .board-bar-fill { height:100%; background:linear-gradient(90deg,var(--blue),var(--green)); }
  .board-metrics { display:flex; gap:8px; flex-wrap:wrap; padding:4px; }
  .board-metric { min-width:100px; padding:6px 9px; background:var(--bg-2); border: 1px solid var(--line-2); }
  .board-metric b { display:block; font-size:16px; color:var(--gold); }
  .board-metric span { font-size:12px; color:var(--muted); }
  .skyline {
    position:absolute; left:0; right:0; bottom:0; height:72%; opacity:.18;
    background: none;
    clip-path: polygon(0 64%,5% 64%,5% 46%,10% 46%,10% 70%,16% 70%,16% 38%,22% 38%,22% 60%,29% 60%,29% 50%,34% 50%,34% 74%,41% 74%,41% 30%,48% 30%,48% 62%,55% 62%,55% 44%,61% 44%,61% 70%,68% 70%,68% 52%,74% 52%,74% 34%,80% 34%,80% 66%,87% 66%,87% 48%,93% 48%,93% 72%,100% 72%,100% 100%,0 100%);
    opacity:.9;
  }
  .skyline::after {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 22% 55%, rgba(242,193,78,.25), transparent 40%),
      radial-gradient(circle at 78% 45%, rgba(91,157,255,.22), transparent 42%);
    mix-blend-mode:screen;
  }
  .floor {
    position:absolute; left:0; right:0; bottom:0; height:30%;
    background: none;
    border-top: 1px solid var(--line-2);
  }
  .lamp { position:absolute; left:50%; top:0; width:4px; height:54px; background:var(--line-2); transform:translateX(-50%); }
  .lamp::after {
    content:""; position:absolute; left:50%; top:50px; width:110px; height:44px; transform:translateX(-50%);
    background:var(--warning); clip-path:polygon(50% 0,100% 100%,0 100%);
    box-shadow:0 0 0 4px var(--line-2), 0 18px 40px rgba(242,193,78,.25);
  }
  .table {
    position:absolute; left:50%; top:76%; width:46%; height:14%; transform:translate(-50%,-50%);
    background:var(--warning); border: 1px solid var(--line-2);
    box-shadow:0 0 0 5px var(--warning), 8px 10px 0 rgba(0,0,0,.45);
  }
  .table i {
    position:absolute; width:14px; height:9px; background:var(--text-1); opacity:.6;
    border: 1px solid var(--line-2);
  }
  .table i.cup { width:9px; height:12px; background:var(--warning); border-radius:0; }
  .table::before {
    content:""; position:absolute; inset:14% 10%;
    border:3px dashed rgba(242,193,78,.18);
  }
  .table::after {
    content:""; position:absolute; left:14%; right:14%; bottom:-12px; height:12px;
    background:var(--bg-3); border: 1px solid var(--line-2);
  }
  .seat .laptop { position:absolute; left:50%; bottom:22px; width:26px; height:14px; transform:translateX(-50%); background:var(--line-2); border: 1px solid var(--line-2); z-index:4; }
  .seat .laptop i { display:block; width:100%; height:100%; background:var(--bg-2); }
  .seat.active .laptop { box-shadow: none; }
  .seat.active .laptop i { background:var(--accent); animation:screenGlow 1.1s steps(2) infinite; }
  @keyframes screenGlow { 0%,100%{opacity:.55;} 50%{opacity:1;} }
  .seat .coffee { position:absolute; left:calc(50% + 16px); bottom:26px; width:10px; height:9px; background:var(--warning); border: 1px solid var(--line-2); display:none; transform:translateY(6px); transition:.2s; z-index:4; }
  .seat.active .coffee { display:block; transform:translateY(0); }
  .seat .coffee i { position:absolute; left:2px; top:-7px; width:2px; height:7px; background:var(--line-2); opacity:.4; animation:steam 1.4s steps(2) infinite; }
  @keyframes steam { 0%,100%{transform:translateY(0);opacity:.15;} 50%{transform:translateY(-3px);opacity:.7;} }
  .seat .sprite { animation:bob 2.8s steps(2) infinite; }
  .seat.active .sprite { animation:work .55s steps(2) infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-2px);} }
  @keyframes work { 0%,100%{transform:translateY(0) rotate(-1deg);} 50%{transform:translateY(-3px) rotate(1deg);} }
  .stars { animation:twinkle 3.6s steps(2) infinite; }
  @keyframes twinkle { 0%,100%{opacity:.55;} 50%{opacity:.95;} }
  .lamp::after { animation:flicker 4s steps(2) infinite; }
  @keyframes flicker { 0%,100%{opacity:1;} 48%{opacity:.9;} 50%{opacity:.72;} 52%{opacity:.95;} }
  .table .holo { position:absolute; inset:16% 10%; border: 1px solid rgba(91,157,255,.22); overflow:hidden; opacity:0; transition:opacity .2s; }
  .room.thinking .table .holo { opacity:1; }
  .table .holo i { position:absolute; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,var(--info),transparent); animation:scan 1.6s linear infinite; }
  @keyframes scan { from{top:-4%;} to{top:104%;} }
  .seat { position:absolute; transform:translate(-50%,-50%); text-align:center; width:92px; transition:transform .15s steps(2); z-index:3; }
  .seat .name {
    margin-top:4px; font-size:12px; color:var(--muted); letter-spacing: 0;
    text-shadow:1px 1px 0 #000; white-space:nowrap;
  }
  .seat.active { transform:translate(-50%,-52%) scale(1.08); }
  .seat.active .name { color:var(--accent); }
  .seat.active svg { filter:drop-shadow(0 0 10px var(--accent)); }
  .sprite { display:inline-block; line-height:0; }
  .talk {
    position:absolute; left:50%; top:9%; transform:translateX(-50%);
    padding:7px 10px; background:var(--bg-3); color:var(--text-1); font-size:12px; font-weight:700;
    border: 1px solid var(--line-2); box-shadow: var(--shadow-card); opacity:0; transition:opacity .2s;
  }
  .talk.show { opacity:1; }
  .download-dock {
    position:relative; margin:0 10px 10px; z-index:8; flex:none;
    background:rgba(10,16,30,.95); border: 1px solid var(--line-2);
    box-shadow: var(--shadow-card); padding:8px; max-height:34%; overflow:auto;
  }
  .dock-head { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--gold); letter-spacing: 0; margin-bottom:6px; }
  .dock-head button { background:none; border:0; color:var(--muted); font:inherit; cursor:pointer; }
  .dock-item { padding:6px; border: 1px solid var(--line-2); background:var(--bg-2); margin-bottom:6px; }
  .dock-title { font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dock-track { height:8px; background:var(--bg-2); border: 1px solid var(--line-2); margin:5px 0; }
  .dock-track i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--blue),var(--green)); transition:width .3s steps(4); }
  .dock-meta { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; gap:6px; }
  .dock-dl { display:inline-block; margin-top:4px; padding:3px 7px; background:var(--gold); color:var(--brand-on); border: 1px solid var(--line-2); box-shadow: var(--shadow-card); font-size:12px; text-decoration:none; }
  .export-counts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 10px; margin-top:7px; font-size:12px; color:var(--muted); line-height:1.6; font-variant-numeric:tabular-nums; }
  .export-counts b { color:var(--text); font-weight:700; }
  .export-scope,.export-checkpoint { margin-top:5px; font-size:12px; color:var(--muted); line-height:1.6; }
  .export-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:6px; }
  .export-actions button { padding:4px 8px; border: 1px solid var(--line-2); background:var(--bg-2); color:var(--text); font:inherit; font-size:12px; cursor:pointer; }
  .export-actions button:disabled { opacity:.6; cursor:wait; }
  .track.indeterminate,.dock-track.indeterminate { overflow:hidden; }
  .track.indeterminate .fill,.dock-track.indeterminate i { width:28%; animation:export-wait 1.8s steps(8) infinite; }
  @keyframes export-wait { from{transform:translateX(-100%);} to{transform:translateX(360%);} }
  @media(prefers-reduced-motion:reduce) { .track.indeterminate .fill,.dock-track.indeterminate i { animation:none; width:100%; opacity:.35; } }

  /* ---------- chat ---------- */
  .chat { min-height:0; display:flex; flex-direction:column; background:var(--bg-1); }
  .chat-head {
    padding:12px 16px; border-bottom:1px solid var(--line-1); background:var(--bg-1);
    display:flex; align-items:center; justify-content:space-between;
  }
  .chat-head h2 { margin:0; font-size:13px; letter-spacing: 0; }
  .chat-head span { font-size:12px; color:var(--muted); letter-spacing: 0; }
  .head-actions { display:flex; align-items:center; gap:8px; }
  .pause-btn { border: 1px solid var(--line-2); background:var(--brand-on); color:var(--gold); font: 500 12px var(--font-sans); line-height: 18px; padding:4px 8px; cursor:pointer; box-shadow: var(--shadow-card); }
  .pause-btn:hover { background:var(--bg-3); }
  .pause-btn[data-paused="1"] { background:var(--gold); color:var(--brand-on); }
  .messages { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  .messages::-webkit-scrollbar { width:8px; }
  .messages::-webkit-scrollbar-thumb { background:var(--line-1); border: 1px solid var(--bg-1); }
  .msg { display:flex; gap:10px; max-width:94%; animation:pop .18s steps(2); }
  @keyframes pop { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .who { font-size:12px; color:var(--muted); margin-bottom:4px; letter-spacing: 0; }
  .msg.user .who { text-align:right; }
  .bubble {
    padding:10px 12px; background:var(--bg-2); border: 1px solid var(--line-2);
    box-shadow: var(--shadow-card); font-size:13px; line-height:1.65; word-break:break-word;
    white-space:normal;
  }
  .msg.user .bubble { background:var(--line-2); border-color: var(--text-1); }
  .msg.system .bubble { background:var(--brand-on); color:var(--warning); }
  .bubble h3 { font-size:14px; margin:8px 0 4px; color:var(--gold); text-shadow:1px 1px 0 #000; }
  .bubble h4 { font-size:13px; margin:7px 0 3px; color:var(--text-1); }
  .bubble .li { margin:2px 0 2px 2px; }
  .bubble code { background:var(--line-1); padding:1px 4px; }
  .live-status { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .live-steps { display:flex; flex-direction:column; gap:4px; margin-top:6px; }
  .live-step { display:flex; align-items:center; gap:6px; padding:4px 7px; border: 1px solid var(--line-2); background:var(--bg-2); font-size:12px; color:var(--muted); }
  .live-step .dot { width:6px; height:6px; background:var(--gold); animation:blink 1s steps(2) infinite; flex:0 0 auto; }
  .live-answer { margin-top:7px; white-space:pre-wrap; font-size:12.5px; line-height:1.65; color:var(--text); }
  .live-answer.streaming::after { content:"▍"; color:var(--gold); animation:blink 1s steps(2) infinite; }
  .live-step.done .dot { background:var(--green); animation:none; }
  .live-step.fail .dot { background:var(--red); animation:none; }
  .parallel-badge {
    display:inline-block; margin-top:7px; padding:4px 8px; background:var(--brand-on); color:var(--gold);

<script>
if (new URLSearchParams(location.search).get("embed") === "1") document.body.classList.add("embed");

const AGENTS = {
  general:  { name:"主席",       title:"综合主持", color:"var(--warning)", hair:"var(--warning-bg)", tie:"var(--warning)", glasses:true  },
  screen:   { name:"选股分析师", title:"选股/策略", color:"var(--info)", hair:"var(--line-1)", tie:"var(--info)", glasses:false },
  data:     { name:"数据工程师", title:"取数/下载", color:"var(--down)", hair:"var(--success-bg)", tie:"var(--down)", glasses:true  },
  research: { name:"研究员",     title:"研究/新闻", color:"var(--chart-4)", hair:"var(--bg-3)", tie:"var(--chart-4)", glasses:false },
  portfolio:{ name:"组合经理",   title:"持仓/风控", color:"var(--warning)", hair:"var(--warning-bg)", tie:"var(--warning)", glasses:true  },
  schedule: { name:"调度助理",   title:"任务/定时", color:"var(--chart-5)", hair:"var(--danger-bg)", tie:"var(--chart-5)", glasses:false }
};
const POS = {
  general:{left:"50%",top:"58%"}, screen:{left:"30%",top:"64%"}, data:{left:"70%",top:"64%"},
  research:{left:"30%",top:"82%"}, portfolio:{left:"70%",top:"82%"}, schedule:{left:"50%",top:"92%"}
};
const FACE = [
"................",
".....hhhhhh.....",
"....hhhhhhhh....",
"...hhhhhhhhhh...",
"...hhffffffhh...",
"...hffffffffh...",
"...hfeffffefh...",
"...hffffffffh...",
"...hfffmmfffh...",
"....ffffffff....",
".....ffffff.....",
"....ssssssss....",
"...sssssttssss..",
"...sssssttssss..",
"...ssssssssss...",
"................"
];
const TOPICS = [
  "用双低策略选 3 只，说明理由",
  "我的自选股今天怎么样",
  "查一下贵州茅台最近的新闻",
  "下载宁德时代近三年数据",
  "今天有哪些任务在跑"
];

let SESSION_KEY = "", DOWNLOAD_KEY = "";
let ownerScope = null, ownerEpoch = 0, ownerCheck = null;
let sessions = [];
let sessionFilter = "";
let activeId = "";
let history = [], renderList = [], busy = false;
let live = null, parallelAgents = [], streamRun = null;
let downloads = {};
let exportListCheck = null, exportListMessage = "";
let workspaceFilesView = null;
const taskPollers = new Map();
const clarificationChecks = new Map();
let sessionId = "";

function scopeFor(status) {
  if (status.accessEnabled === false) return "local";
  if (!status.loggedIn) return null;
  if (status.authMethod === "admin") return "admin";
  return status.user?.status === "approved" && Number(status.user.id) > 0 ? `user:${status.user.id}` : null;
}

function stopTaskPollers() {
  taskPollers.forEach(poller => { clearTimeout(poller.timer); poller.controller.abort(); });
  taskPollers.clear();
}

function bindOwner(scope) {
  if (scope === ownerScope) return;
  ownerEpoch++;
  streamRun?.controller.abort();
  stopTaskPollers();
  exportListCheck?.controller.abort();
  exportListCheck = null;
  exportListMessage = "";
  workspaceFilesView = null;
  clarificationChecks.forEach(check => check.controller.abort());
  clarificationChecks.clear();
  ownerScope = scope;
  SESSION_KEY = scope ? `leziwu.sessions.v2:${scope}` : "";
  DOWNLOAD_KEY = scope ? `leziwu.downloads.v2:${scope}` : "";
  // Never migrate the old unscoped keys: their owner cannot be established.
  sessions = scope ? loadSessions() : [];
  downloads = scope ? loadDownloads() : {};
  managedTasks = [];
  busy = false; live = null; streamRun = null;
  inputEl.value = "";
  document.getElementById("taskInput").value = "";
  document.getElementById("wsFiles").hidden = true;
  document.getElementById("wsFilesList").textContent = "";
  hidePause();
  activeId = "";
  try { activeId = scope ? localStorage.getItem(SESSION_KEY + ".active") || "" : ""; } catch (e) { /* memory-only mode */ }
  if (!sessions.some(s => s.id === activeId)) activeId = sessions[0]?.id || "";
  sessions.forEach(s => {
    if (s.status === "running") {
      s.status = "interrupted";
      (s.messages || (s.messages = [])).push({ role:"system", content:"上次会议连接已中断，无法确认最终结果；不会自动重发。已提交的后台任务请到任务页核对。" });
    }
  });
  if (scope && !sessions.length) createSession("智能投研团队");
  else { bindActive(); persistSessions(); renderSessions(); }
  render(); renderDock(); renderManagedTasks();
  renderBoard(activeSession()?.lastWidgets || []);
  sendEl.disabled = !scope;
  document.getElementById("taskStart").disabled = !scope;
  if (!scope) messagesEl.textContent = "请先登录；未读取任何账号的本地记录。";
  else Object.keys(downloads).forEach(id => pollDownload(id, true));
  if (scope) { void restoreClarifications(activeSession()); void refreshEssayExports(); }
}

async function refreshOwner() {
  if (ownerCheck) return ownerCheck;
  ownerCheck = (async () => {
    try {
      const response = await fetch("/api/v1/user-auth/status", { credentials:"same-origin", cache:"no-store" });
      if (!response.ok) throw new Error("身份状态未能确认");
      bindOwner(scopeFor(await response.json()));
      if (!ownerScope) messagesEl.textContent = "请先登录；未读取任何账号的本地记录。";
      return !!ownerScope;
    } catch (error) {
      bindOwner(null);
      sendEl.disabled = true;
      document.getElementById("taskStart").disabled = true;
      messagesEl.textContent = "暂时无法确认登录身份，未读取本地记录。回到此页后会自动重试。";
      return false;
    } finally { ownerCheck = null; }
  })();
  return ownerCheck;
}

function loadSessions() {
  try {
    const raw = JSON.parse(localStorage.getItem(SESSION_KEY) || "[]");
    return Array.isArray(raw) ? raw.filter(s => s && s.id) : [];
  } catch (e) { return []; }
}

function persistSessions() {
  if (!ownerScope) return;
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(sessions)); } catch (e) { /* ignore */ }
  try { if (activeId) localStorage.setItem(SESSION_KEY + ".active", activeId); } catch (e) { /* ignore */ }
}

function activeSession() {
  return sessions.find(s => s.id === activeId) || null;
}

function createSession(title) {
  const id = "task-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);
  const item = {
    id, title: title || "新任务", createdAt: Date.now(), updatedAt: Date.now(),
    messages: [], history: [], lastWidgets: [], status: "idle", workspace: id,
    sessionId: id,
  };
  sessions.unshift(item);
  activeId = id;
  bindActive();
  persistSessions();
  renderSessions();
  return item;
}

function bindActive() {
  const s = activeSession();
  if (!s) { history = []; renderList = []; sessionId = ""; return; }
  history = s.history || (s.history = []);
  renderList = s.messages || (s.messages = []);
  sessionId = s.sessionId || s.id;
}

function saveActive() {
  const s = activeSession();
  if (!s) return;
  s.messages = renderList;
  s.history = history;
  s.updatedAt = Date.now();
  persistSessions();
}

function clarificationList(data) {
  const list = [...(Array.isArray(data?.clarifications) ? data.clarifications : [])];
  if (data?.clarification) list.push(data.clarification);
  return list.filter(item => item && typeof item.id === "string" && typeof item.question === "string");
}

function meetingOutcome(data) {
  return ["waiting_input", "submitted", "partial", "no_results", "failed"].includes(data?.status) ? data.status : "done";
}

function sessionDisplayStatus(session) {
  if (["running", "waiting_input"].includes(session.status)) return session.status;
  const exports = (session.messages || []).flatMap(message => message.tasks || []).filter(isTrackedTask);
  if (!exports.length) return session.status;
  const states = exports.map(task => downloads[task.task_id] || task);
  if (states.some(task => !task || !task.verified || ["queued", "running", "indexing", "collecting", "screening", "packaging", "retrying", "processing"].includes(task.status))) return "submitted";
  if (states.some(task => task.resumable && ["failed", "interrupted", "paused"].includes(task.status))) return "resumable";
  const successful = task => isPersistentExport(task) ? exportDownloadReady(task) : task.verified && ["completed", "success", "done"].includes(task.status);
  if (states.every(successful)) return "done";
  if (states.every(task => task.status === "no_results")) return "no_results";
  return states.some(successful) || states.some(task => ["limited", "partial", "paused"].includes(task.status)) ? "partial" : "failed";
}

function upsertClarifications(target, data) {
  if (!target) return;
  target.clarifications ||= [];
  clarificationList(data).forEach(question => {
    const existing = target.clarifications.find(item => item.id === question.id);
    const safe = { ...question, options:Array.isArray(question.options) ? question.options : [], status:question.status || "pending" };
    if (existing) Object.assign(existing, safe);
    else target.clarifications.push({ ...safe, selected:"", draft:"", error:"", awaiting_ack:false });
  });
  if (target.clarifications.some(question => question.status === "pending")) target.status = "waiting_input";
}

function clarificationContext(question) {
  const context = question.context;
  if (typeof context === "string") return context;
  if (!context || typeof context !== "object") return "";
  if (typeof context.summary === "string") return context.summary;
  if (typeof context.description === "string") return context.description;
  const company = context.company_name || context.keyword || context.query || "";
  const start = context.date_start || context.start_date || "";
  const end = context.date_end || context.end_date || "";
  const total = Number(context.total);
  return [company, start || end ? `${start || "不限起始"} → ${end || "不限结束"}` : "", Number.isFinite(total) && context.total !== null && context.total !== undefined ? `命中 ${total.toLocaleString("zh-CN")} 条` : ""].filter(Boolean).join(" · ");
}

function clarificationHtml(question, target) {
  const checking = clarificationChecks.has(`${target.id}:${question.id}`);
  const pending = question.status === "pending";
  const disabled = !pending || busy || question.awaiting_ack || checking;
  const labels = { pending:"等待你的选择", running:"回答已提交，正在继续处理", answered:"已确认", failed:"上次继续执行失败，请重新发起任务", unavailable:"该问题暂不可确认" };
  const state = checking ? "正在核验待答状态…" : question.awaiting_ack ? (busy ? "正在提交，请勿重复操作…" : "待答状态尚未核验") : labels[question.status] || "状态待核验";
  const answer = question.answer || {};
  const answerOption = (question.options || []).find(option => option.id === answer.option_id);
  const answerText = [answerOption?.label, answer.text].filter(Boolean).join("；");
  const context = clarificationContext(question);
  return `<section class="clarification-card" data-clarification="${escapeHtml(question.id)}" aria-label="${escapeHtml(question.question)}">
    <div class="clarification-state" role="status">${escapeHtml(state)}</div>
    <h3>${escapeHtml(question.question)}</h3>
    ${context ? `<div class="clarification-context">${escapeHtml(context)}</div>` : ""}
    <fieldset class="clarification-options" aria-label="可选回答" ${disabled ? "disabled" : ""}>
      ${(question.options || []).map(option => `<label class="clarification-option"><input type="radio" name="clarification-${escapeHtml(question.id)}" value="${escapeHtml(option.id)}" ${question.selected === option.id ? "checked" : ""}><span><strong>${escapeHtml(option.label)}${Number.isFinite(option.count) ? `<span class="clarification-count">${Number(option.count).toLocaleString("zh-CN")} 条</span>` : ""}</strong>${option.description ? `<small>${escapeHtml(option.description)}</small>` : ""}</span></label>`).join("")}
    </fieldset>
    ${question.allow_custom ? `<label class="clarification-custom">补充要求（也可只填写文字回答）<textarea rows="2" maxlength="2000" placeholder="例如：只要原文，不做 AI 分析" ${disabled ? "disabled" : ""}>${escapeHtml(question.draft || "")}</textarea></label>` : ""}
    ${answerText ? `<div class="clarification-answer">已选：${escapeHtml(answerText)}</div>` : ""}
    <div class="clarification-actions">
      ${pending ? `<button type="button" data-clarification-submit ${disabled ? "disabled" : ""}>确认并继续</button>` : ""}
      ${question.status !== "answered" || !question.result_recorded ? `<button type="button" class="clarification-refresh" data-clarification-refresh ${checking || (busy && question.awaiting_ack) ? "disabled" : ""}>${question.status === "answered" ? "恢复结果" : "核验状态"}</button>` : ""}
      ${pending ? `<span class="clarification-note">确认前不会执行下载或分析；可离开页面后再回答。</span>` : ""}
    </div>
    ${question.error ? `<div class="clarification-error" role="alert">${escapeHtml(question.error)}</div>` : ""}
  </section>`;
}

async function restoreClarification(target, question) {
  if (!ownerScope || !target || !question || (question.status === "answered" && question.result_recorded)) return;
  const key = `${target.id}:${question.id}`;
  if (clarificationChecks.has(key)) return clarificationChecks.get(key).promise;
  const check = { controller:new AbortController(), epoch:ownerEpoch, promise:null };
  clarificationChecks.set(key, check);
  if (target.id === activeId) render();
  check.promise = (async () => {
    try {
      const response = await fetch(`/api/v1/command/clarifications/${encodeURIComponent(question.id)}?workspace_id=${encodeURIComponent(target.workspace || target.sessionId || target.id)}`, { credentials:"same-origin", cache:"no-store", signal:check.controller.signal });
      const data = await response.json().catch(() => ({}));
      if (check.epoch !== ownerEpoch) return;
      if (!response.ok || !data.clarification) {
        if ([403, 404, 410].includes(response.status)) {
          question.status = "unavailable";
          question.error = "这条待答问题不存在、已过期或无权访问。请重新发起需求，不会自动重新执行。";
        } else throw new Error("待答状态暂时无法确认");
      } else {
        upsertClarifications(target, data);
        question.awaiting_ack = false;
        question.error = "";
        if (question.status === "answered" && data.result && !question.result_recorded) {
          // Recovery is read-only: reuse the server's saved result, never
          // execute the choice again just to recover a download or widget.
          question.result_recorded = true;
          addAssistant(data.result, target.id);
        }
        if (data.result) target.status = meetingOutcome(data.result);
        else if (data.status) target.status = data.status === "waiting_input" ? "waiting_input" : ["completed", "answered"].includes(data.status) ? "done" : data.status;
        if ((target.clarifications || []).some(item => item.status === "pending")) target.status = "waiting_input";
      }
    } catch (error) {
      if (check.epoch !== ownerEpoch) return;
      question.error = "状态暂时无法核验，已保留你的选择和补充要求。请点击‘核验状态’后再继续；不会自动重发。";
      question.awaiting_ack = true;
    } finally {
      if (check.epoch === ownerEpoch) {
        clarificationChecks.delete(key);
        persistSessions(); renderSessions();
        if (target.id === activeId) render();
      }
    }
  })();
  return check.promise;
}

async function restoreClarifications(target) {
  await Promise.all((target?.clarifications || []).filter(question => question.status !== "answered" || !question.result_recorded).map(question => restoreClarification(target, question)));
}

async function submitClarification(questionId) {
  const target = activeSession();
  const question = target?.clarifications?.find(item => item.id === questionId);
  if (!question || question.status !== "pending" || busy || question.awaiting_ack || clarificationChecks.has(`${target.id}:${question.id}`)) return;
  const option = (question.options || []).find(item => item.id === question.selected);
  const text = question.allow_custom ? String(question.draft || "").trim() : "";
  if (!option && !text) {
    question.error = "请先选择一项，或填写补充要求。";
    render(); return;
  }
  await send({ question_id:question.id, ...(option ? { option_id:option.id } : {}), ...(text ? { text } : {}) }, target.id);
}

function renderSessions() {
  const el = document.getElementById("sessionList");
  if (!el) return;
  const query = (document.getElementById("sessionSearch")?.value || "").trim().toLowerCase();
  const filtered = sessions.filter(s => {
    const state = sessionDisplayStatus(s);
    if (query && !String(s.title || "").toLowerCase().includes(query)) return false;
    if (!sessionFilter) return true;
    if (sessionFilter === "running") return ["running", "submitted"].includes(state);
    if (sessionFilter === "waiting_input") return state === "waiting_input";
    if (sessionFilter === "done") return ["done", "partial", "no_results"].includes(state);
    if (sessionFilter === "failed") return ["failed", "resumable"].includes(state);
    return true;
  });
  el.innerHTML = filtered.map(s => {
    const state = sessionDisplayStatus(s);
    const labels = { waiting_input:"等待选择", running:"运行中", submitted:"后台执行中", resumable:"待续跑", interrupted:"结果待确认", failed:"失败", partial:"部分完成", no_results:"未命中", done:"已完成" };
    return `<div class="session-item ${s.id === activeId ? "active" : ""} ${state || ""}" data-id="${s.id}">

      <div class="acts"><button type="button" data-act="files">文件</button><button type="button" data-act="rename">改名</button><button type="button" data-act="del">删</button></div>
    </div>`;
  }).join("") || `<div style="color:var(--muted);font-size:12px;padding:8px">${sessions.length ? "没有匹配的任务" : "还没有任务，点上方新建"}</div>`;
  el.querySelectorAll(".session-item").forEach(node => {
    node.addEventListener("click", (event) => {
      const id = node.dataset.id;
      const act = event.target && event.target.dataset ? event.target.dataset.act : "";
      if (act === "del") { event.stopPropagation(); deleteSession(id); return; }
      if (act === "rename") { event.stopPropagation(); renameSession(id); return; }

      document.querySelector(".sessions")?.classList.remove("is-open");

function switchSession(id) {

function escapeHtml(text) {
  return String(text == null ? "" : text).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function mdTable(rows) {
  const cells = rows.map(row => row.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
  if (cells.length < 2) return "";
  const header = cells[0], body = cells.slice(2);
  return `<table class="pixel-table"><thead><tr>${header.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body.map(row => `<tr>${row.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

function markdown(text) {
  const lines = escapeHtml(text).split("\n");
  let html = "", table = [];
  const flush = () => { if (table.length) { html += mdTable(table); table = []; } };
  for (const line of lines) {
    if (/^\s*\|.*\|\s*$/.test(line)) { table.push(line); continue; }
    flush();
    if (/^###\s+/.test(line)) html += `<h4>${line.replace(/^###\s+/, "")}</h4>`;
    else if (/^##\s+/.test(line)) html += `<h3>${line.replace(/^##\s+/, "")}</h3>`;
    else if (/^#\s+/.test(line)) html += `<h3>${line.replace(/^#\s+/, "")}</h3>`;
    else if (/^[-*]\s+/.test(line)) html += `<div class="li">▸ ${line.replace(/^[-*]\s+/, "")}</div>`;
    else if (/^\s*$/.test(line)) html += `<div style="height:5px"></div>`;
    else html += `<div>${line}</div>`;
  }
  flush();
  return html
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/(https?:\/\/[^\s<]+)/g, (url) => {
      const match = url.match(/^(.*?)([。，、；：）)]*)$/);
      const clean = match[1];
      const tail = match[2] || "";
      return `<a href="${clean}" target="_blank" rel="noopener">${clean}</a>${tail}`;
    });
}

function widgetHtml(w) {
  if (!w || !w.type) return "";
  const title = w.title ? `<div class="widget-title">${escapeHtml(w.title)}</div>` : "";
  if (w.type === "chart") return `<div class="widget chat-visual">${title}${boardChart(w)}</div>`;
  if (w.type === "table") return `<div class="widget chat-visual">${title}<div class="table-scroll">${boardTable(w)}</div></div>`;
  if (w.type === "bars") return `<div class="widget chat-visual">${title}${boardBars(w)}</div>`;
  if (w.type === "metrics") return `<div class="widget chat-visual">${title}${boardMetrics(w)}</div>`;
  if (w.type === "image" || w.type === "picture") {
    const src = w.url || w.src;
    if (!src) return "";
    return `<div class="widget chat-visual">${title}<img class="chat-figure" src="${escapeHtml(src)}" alt="${escapeHtml(w.alt || w.title || "图片")}"></div>`;
  }
  if (w.type === "file") {
    const bytes = Number(w.size || 0);
    const sizeText = bytes >= 1048576 ? (bytes / 1048576).toFixed(2) + " MB" : Math.round(bytes / 1024) + " KB";
    const ext = String(w.filename || "").split(".").pop().toLowerCase();
    const isZip = ext === "zip";
    const isAudio = ["mp3", "wav", "m4a", "aac", "ogg", "flac"].includes(ext);
    const isText = ["txt", "md", "markdown"].includes(ext);
    const iconLabel = isZip ? "ZIP" : isAudio ? "MP3" : isText ? "TXT" : "PDF";
    const iconClass = isZip ? " zip" : isAudio ? " audio" : isText ? " text" : "";
    return `<div class="widget">${title}<div class="file-card">
      <div class="file-icon${iconClass}">${iconLabel}</div>
      <div style="min-width:0"><a href="${escapeHtml(w.url)}" target="_blank" rel="noopener">${escapeHtml(w.filename)}</a>
      <div class="file-meta">${escapeHtml(w.meta || "")} · ${sizeText}</div></div>
      <a class="file-dl" href="${escapeHtml(w.url)}" download>下载</a>
    </div></div>`;
  }
  if (w.type === "news") {
    const items = w.items || [];
    return `<details class="widget-fold news-fold"><summary>${escapeHtml(w.title || "新闻")} · ${items.length} 条</summary><div class="news">${items.map(item => {
      const icon = item.icon ? `<img class="news-icon" src="${escapeHtml(item.icon)}" alt="" onerror="this.style.display='none'">` : `<div class="news-icon"></div>`;
      const meta = [item.source, (item.publishedDate || "").slice(0, 10)].filter(Boolean).join(" · ");
      return `<div class="news-card">${icon}<div>
        <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>
        <div class="news-meta">${escapeHtml(meta)}</div>
        <div class="news-snippet">${escapeHtml(item.snippet || item.summary || "")}</div>
      </div></div>`;
    }).join("")}</div></details>`;
  }
  return "";
}

function boardEmpty() {

function boardChart(w) {
  const series = (w.series || []).map(s => ({ date: String(s.date || ""), close: Number(s.close) })).filter(s => Number.isFinite(s.close));
  if (series.length < 2) return boardTable({ columns: ["日期", "收盘"], rows: series.map(s => [s.date, s.close]) });
  const W = 1000, H = 430, L = 56, R = 24, T = 24, B = 40;
  const min = Math.min(...series.map(s => s.close));
  const max = Math.max(...series.map(s => s.close));
  const span = max - min || 1;
  const pts = series.map((s, i) => {
    const x = L + (W - L - R) * i / (series.length - 1);
    const y = T + (H - T - B) * (1 - (s.close - min) / span);
    return [x, y];
  });
  const line = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area = `${line} L${pts[pts.length - 1][0].toFixed(1)},${H - B} L${pts[0][0].toFixed(1)},${H - B} Z`;
  const grid = [0, .25, .5, .75, 1].map(r => {
    const y = T + (H - T - B) * r;
    return `<line x1="${L}" y1="${y}" x2="${W - R}" y2="${y}" stroke="var(--line-2)" stroke-width="1" stroke-dasharray="4 6"/>`;
  }).join("");
  const labels = [0, .5, 1].map(r => {
    const value = max - (max - min) * r;
    const y = T + (H - T - B) * r + 4;
    return `<text x="${L - 8}" y="${y}" fill="var(--text-2)" font-size="16" text-anchor="end">${value.toFixed(2)}</text>`;
  }).join("");
  const first = series[0], last = series[series.length - 1];
  return `<div class="board-chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${grid}${labels}
    <path d="${area}" fill="rgba(15,110,86,.12)"/>
    <path d="${line}" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="5" fill="var(--brand)"/>
    <text x="${L}" y="${H - 12}" fill="var(--text-2)" font-size="15">${escapeHtml(first.date)}</text>
    <text x="${W - R}" y="${H - 12}" fill="var(--text-2)" font-size="15" text-anchor="end">${escapeHtml(last.date)}</text>
  </svg><div class="board-chart-foot"><span>最新 ${last.close.toFixed(2)}</span><span>区间 ${min.toFixed(2)} – ${max.toFixed(2)}</span></div></div>`;
}

function boardTable(w) {
  const cols = (w.columns || []).map(c => `<th>${escapeHtml(c)}</th>`).join("");
  const rows = (w.rows || []).slice(0, 40).map(r => `<tr>${(r || []).map(c => `<td title="${escapeHtml(c ?? "")}">${escapeHtml(c ?? "")}</td>`).join("")}</tr>`).join("");
  return `<div class="board-table-wrap"><table class="board-table"><thead><tr>${cols}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function boardBars(w) {
  const items = w.items || [];
  const max = Math.max(1, ...items.map(i => Number(i.value) || 0));
  return `<div class="board-bars">${items.map(i => {
    const v = Number(i.value) || 0;
    return `<div class="board-bar"><span>${escapeHtml(i.label)}</span><div class="board-bar-track"><div class="board-bar-fill" style="width:${Math.round(v / max * 100)}%"></div></div><b>${v.toFixed(1)}</b></div>`;
  }).join("")}</div>`;
}

function boardMetrics(w) {
  return `<div class="board-metrics">${(w.items || []).map(i => `<div class="board-metric"><b>${escapeHtml(i.value ?? "")}</b><span>${escapeHtml(i.label ?? "")}</span></div>`).join("")}</div>`;
}

function renderBoard(widgets, source) {

  const primary = list.find(w => w.type === "chart") || list.find(w => w.type === "table") || list.find(w => w.type === "bars") || list[0];
  if (title) title.textContent = primary.title || "智能投研黑板";

let managedTasks = [];
let managedSeq = 0;

function formatElapsed(task) {
  const end = task.finishedAt || Date.now();
  const total = Math.max(0, Math.floor((end - task.startedAt) / 1000));
  const minutes = Math.floor(total / 60);
  const seconds = total % 60;
  return minutes ? `${minutes}m${String(seconds).padStart(2,"0")}s` : `${seconds}s`;
}

function renderManagedTasks() {
  const list = document.getElementById("taskList");
  if (!list) return;
  if (!managedTasks.length) {
    list.innerHTML = `<div class="task-empty">本页暂无会议请求。<br>上面输入一句话，点“开始”。</div>` + exportLedgerHtml();
    return;
  }
  list.innerHTML = managedTasks.map(task => {
    const labels = { running:"执行中", paused:"已暂停", submitted:"后台执行中", resumable:"待续跑", waiting_input:"等待选择", completed:"已完成", done:"已完成", partial:"部分完成", no_results:"未命中", failed:"失败" };
    const linkedSession = sessions.find(session => session.id === task.sessionId);
    const state = linkedSession && task.status !== "paused" ? sessionDisplayStatus(linkedSession) : task.status;
    const agent = (task.result && (task.result.agentName || task.result.agent)) || "";
    const canPause = task.status === "running" || task.status === "paused";
    const canView = !!(task.result && task.result.reply);
    return `<div class="task-row ${task.status}">
      <div class="task-row-head"><span class="task-title">${escapeHtml(task.title)}</span><span class="task-status">${labels[state] || state}</span></div>
      <div class="task-meta">${escapeHtml(agent)}${agent ? " · " : ""}${formatElapsed(task)}${task.error ? " · " + escapeHtml(task.error) : ""}</div>
      <div class="task-actions">
        ${canPause ? `<button data-task-pause="${task.id}">${task.status === "paused" ? "继续" : "暂停"}</button>` : ""}
        ${canView ? `<button data-task-view="${task.id}">查看</button>` : ""}
      </div>
    </div>`;
  }).join("") + exportLedgerHtml();
}

async function startManagedTask() {
  const input = document.getElementById("taskInput");
  const text = (input?.value || "").trim();
  if (!text) return;
  if (!await refreshOwner()) return;
  const epoch = ownerEpoch;
  input.value = "";
  const session = createSession(text.slice(0, 22));
  session.status = "running";
  session.history.push({ role:"user", content:text });
  session.messages.push({ role:"user", content:text });
  persistSessions();
  renderSessions();
  const id = session.sessionId;
  const task = { id, sessionId: session.id, title:text, status:"running", startedAt:Date.now(), finishedAt:null, result:null, error:null };
  managedTasks.unshift(task);
  renderManagedTasks();
  try {
    const response = await fetch("/api/v1/command/chat", {
      method:"POST", credentials:"same-origin",
      headers:{"content-type":"application/json"},
      body: JSON.stringify({ messages:[{ role:"user", content:text }], session_id:id, workspace_id:session.workspace })
    });
    const data = await response.json().catch(() => ({}));
    if (epoch !== ownerEpoch) return;
    if (response.status === 401) {
      task.status = "failed"; task.error = "登录过期";
      session.status = "failed";
    } else if (!response.ok) {
      task.status = "failed";
      task.error = (data.detail && (data.detail.message || data.detail)) || "请求失败";
      session.status = "failed";
    } else {
      task.status = meetingOutcome(data) === "done" ? "completed" : meetingOutcome(data);
      task.result = data;
      session.status = meetingOutcome(data);
      upsertClarifications(session, data);
      session.history.push({ role:"assistant", content:data.reply || "" });
      session.messages.push({
        role:"assistant", content:data.reply || "", agent:data.agent || "general",
        steps:data.steps || [], tasks:data.tasks || [], widgets:data.widgets || [],
        parallel:!!data.parallel, subtasks:data.subtasks || [], dag:!!data.dag
      });
      session.lastWidgets = data.widgets || [];
      (data.tasks || []).forEach(startTaskPolling);
    }
  } catch (error) {
    if (epoch !== ownerEpoch) return;
    task.status = "failed";
    task.error = "网络错误";
    session.status = "interrupted";
  }
  if (task.error) session.messages.push({ role:"system", content:`请求未完成：${String(task.error)}。不会自动重发；已提交的后台任务请到任务页核对。` });
  session.updatedAt = Date.now();
  persistSessions();
  renderSessions();
  if (activeId === session.id) { bindActive(); render(); renderBoard(session.lastWidgets || []); }
  task.finishedAt = Date.now();
  renderManagedTasks();
}

async function toggleManagedPause(id) {
  const task = managedTasks.find(item => item.id === id);
  if (!task || (task.status !== "running" && task.status !== "paused")) return;
  const next = task.status !== "paused";
  try {
    await fetch("/api/v1/command/pause", {
      method:"POST", credentials:"same-origin",
      headers:{"content-type":"application/json"},
      body: JSON.stringify({ session_id:id, paused:next })
    });
    task.status = next ? "paused" : "running";
    if (!next) task.finishedAt = null;
  } catch (error) {
    task.error = "暂停操作失败";
  }
  renderManagedTasks();
}

function viewManagedTask(id) {
  const task = managedTasks.find(item => item.id === id);
  if (!task) return;
  if (task.sessionId) switchSession(task.sessionId);
  closeTaskManager();
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function render() {
  messagesEl.innerHTML = "";
  for (const item of renderList) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + item.role;
    if (item.role === "user") {
      wrap.innerHTML = `<div class="body"><div class="who">你</div><div class="bubble">${escapeHtml(item.content)}</div></div>`;
    } else if (item.role === "assistant") {
      const a = AGENTS[item.agent] || AGENTS.general;
      const steps = (item.steps || []).map(s =>
        `<div class="step ${s.ok ? "ok" : "fail"}"><span class="tag">${s.ok ? "✓" : "!"}</span><span>${escapeHtml(s.summary || s.name)}</span></div>`).join("");
      const stepCount = (item.steps || []).length;
      const failedCount = (item.steps || []).filter(s => !s.ok).length;
      const stepsFold = stepCount
        ? `<details class="steps-fold"><summary>执行过程 · ${stepCount} 步${failedCount ? ` · ${failedCount} 失败` : ""}</summary><div class="steps-list">${steps}</div></details>`
        : "";
      const widgets = (item.widgets || []).map(widgetHtml).join("");
      const tasks = (item.tasks || []).map(t => `
        <div class="task-card" data-task="${escapeHtml(t.task_id)}">
          <div class="row"><span>后台任务</span><span class="task-status">排队中</span></div>
          <div class="track"><div class="fill"></div></div>
          <div class="result"></div>
        </div>`).join("");
      wrap.innerHTML = `<div class="avatar">${sprite(item.agent, 3)}</div>
        <div class="body">
          <div class="who"><span style="color:${a.color};font-weight:700">${a.name}</span> · ${a.title}</div>
          <div class="bubble">${markdown(item.content)}</div>
          ${item.parallel ? `<div class="parallel-badge">⚡ 并行执行 ${(item.subtasks || []).length} 个任务：${(item.subtasks || []).map(x => x.agentName).join(" / ")}</div>` : ""}
          ${item.dag ? `<div class="parallel-badge">🔗 DAG：选股 → 逐只新闻 → 汇总</div>` : ""}
          ${widgets}${stepsFold}${tasks}
        </div>`;
    } else {
      wrap.innerHTML = `<div class="body"><div class="bubble">${escapeHtml(item.content)}</div></div>`;

  }
  const target = activeSession();

    row.innerHTML = `<div class="avatar">${sprite("general", 3)}</div><div class="body">${clarificationHtml(question, target)}</div>`;
    messagesEl.appendChild(row);
  });
  syncMeetingStatus();
  Object.values(downloads).forEach(renderTaskCards);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function typing(on, agent="general") {

    <div class="bubble typing"><i></i><i></i><i></i></div></div>`;
