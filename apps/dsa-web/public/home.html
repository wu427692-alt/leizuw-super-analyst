let paused = false;

function updatePauseBtn() {
  const button = document.getElementById("pauseBtn");
  if (!button) return;
  button.textContent = paused ? "继续" : "暂停";
  button.dataset.paused = paused ? "1" : "0";
}

function showPause() {
  const button = document.getElementById("pauseBtn");
  if (!button) return;
  paused = false;
  updatePauseBtn();
  button.hidden = false;
}

function hidePause() {
  const button = document.getElementById("pauseBtn");
  if (!button) return;
  paused = false;
  updatePauseBtn();
  button.hidden = true;
}

function togglePause() {
  if (!streamRun || streamRun.epoch !== ownerEpoch) return;
  paused = !paused;
  updatePauseBtn();
  fetch("/api/v1/command/pause", {
    method: "POST",
    credentials: "same-origin",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ session_id: streamRun.serverSessionId, paused }),
  }).catch(() => {});
  const status = document.getElementById("liveStatus");
  if (status) status.textContent = paused ? "暂停请求已发送，当前步骤结束后生效" : "继续请求已发送";
}

function startLive() {
  const boardMeta = document.getElementById("boardMeta");
  if (boardMeta) boardMeta.textContent = "正在处理…";
  const room = document.querySelector(".room");
  if (room) room.classList.add("thinking");
  const wrap = document.createElement("div");
  wrap.className = "msg assistant";
  wrap.id = "liveRow";
  wrap.innerHTML = `<div class="avatar" id="liveAvatar">${sprite("general", 3)}</div>
    <div class="body">
      <div class="who" id="liveWho"><span style="color:${AGENTS.general.color};font-weight:700">主席</span> · 思考中</div>
      <div class="bubble"><div class="live-status" id="liveStatus">正在判断任务…</div>
      <div class="live-steps" id="liveSteps"></div>
      <div class="live-answer" id="liveAnswer"></div></div>
    </div>`;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

function liveThinking(agent, text) {
  if (!live) return;
  if (agent) {
    if (parallelAgents.length) setActiveMany([...new Set([...parallelAgents, agent])]);
    else setActive(agent);
  }
  const a = agent ? AGENTS[agent] : AGENTS.general;
  const who = document.getElementById("liveWho");
  const status = document.getElementById("liveStatus");
  const avatar = document.getElementById("liveAvatar");
  if (who) who.innerHTML = `<span style="color:${a.color};font-weight:700">${a.name}</span> · 思考中`;
  if (avatar) avatar.innerHTML = sprite(agent || "general", 3);
  if (status) status.textContent = text;
}

function liveToolStart(ev) {
  if (!live) return;
  const boardMeta = document.getElementById("boardMeta");
  if (boardMeta) boardMeta.textContent = `${ev.agentName || ev.agent || ""} · ${ev.summary || ""}`;
  liveThinking(ev.agent, "正在调用工具…");
  const row = document.createElement("div");
  row.className = "live-step";
  row.dataset.key = ev.name + ":" + (ev.summary || "");
  row.dataset.agent = ev.agent || "";
  row.innerHTML = `<span class="dot"></span><span>${escapeHtml(ev.summary || ev.name)}</span>`;
  const steps = document.getElementById("liveSteps");
  if (steps) steps.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function liveToolResult(ev) {
  if (!live) return;
  const steps = document.getElementById("liveSteps");
  if (!steps) return;
  const rows = [...steps.children].reverse();
  const row = rows.find(item => (item.dataset.key || "").startsWith(ev.name + ":") && (item.dataset.agent || "") === (ev.agent || ""));
  if (row) {
    row.classList.add(ev.ok ? "done" : "fail");
    const text = row.querySelector("span:last-child");
    if (text) text.textContent = ev.summary || ev.name;
  }
}

function handleEvent(ev, run = streamRun) {
  if (!ev || !ev.type) return;
  if (!run || run.epoch !== ownerEpoch) return;
  const target = sessions.find(s => s.id === run.sessionId);
  if (!target) return;
  // A request owns its originating session even while another is selected.
  if (ev.type === "done" || ev.type === "error") {
    hidePause();
    document.querySelector(".room")?.classList.remove("thinking");
    live = null; parallelAgents = [];
    if (ev.type === "done" && ev.payload) {
      const previous = target.clarifications?.find(question => question.id === run.clarificationId);
      if (previous) { previous.status = "answered"; previous.awaiting_ack = false; previous.error = ""; previous.result_recorded = true; }
      addAssistant(ev.payload, run.sessionId);
    }
    else {
      const previous = target.clarifications?.find(question => question.id === run.clarificationId);
      if (previous) {
        previous.awaiting_ack = true;
        previous.error = "本次回答是否完成尚未确认。请核验状态；不会自动重发或重复下载。";
        target.status = "waiting_input";
        persistSessions();
        if (target.id === activeId) render();
      } else {
        target.status = "interrupted";
        addSystem(ev.message || "本次请求未确认完成；不会自动重发，请核对后台任务。", run.sessionId);
      }
      renderSessions();
    }
    run.finished = true;
    return;
  }
  if (ev.type === "clarification") {
    upsertClarifications(target, ev);
    target.status = "waiting_input";
    persistSessions(); renderSessions();
    if (target.id === activeId) { bindActive(); render(); }
    return;
  }
  if (ev.type === "task") {
    startTaskPolling(ev.task);
  }
  if (ev.type === "tool_result" && ev.ok && ev.name === "get_task_status") {
    reconcileExportIds(sessionExportIds(target));
  }
  if (activeId !== run.sessionId) return;
  if (ev.type === "thinking") { liveThinking(ev.agent, ev.text || "思考中…"); return; }
  if (ev.type === "route") {
    parallelAgents = [];
    setActive(ev.agent);
    liveThinking(ev.agent, "主席分派：" + (ev.reason || ev.agentName));
    return;
  }
  if (ev.type === "dag") {
    parallelAgents = ["screen", "research"];
    setActiveMany(parallelAgents);
    const count = Math.max(0, (ev.nodes || []).length - 1);
    liveThinking("general", `DAG：选股 → ${count} 只股票新闻 → 汇总`);
    const steps = document.getElementById("liveSteps");
    if (steps) {
      (ev.nodes || []).forEach(node => {
        const row = document.createElement("div");
        row.className = "live-step";
        row.innerHTML = `<span class="dot"></span><span>${escapeHtml(node.label)}</span>`;
        steps.appendChild(row);
      });
    }
    return;
  }
  if (ev.type === "plan") {
    parallelAgents = (ev.tasks || []).map(task => task.agent);
    setActiveMany(parallelAgents);
    liveThinking("general", "拆成 " + parallelAgents.length + " 个任务并行执行");
    const steps = document.getElementById("liveSteps");
    if (steps) {
      (ev.tasks || []).forEach(task => {
        const row = document.createElement("div");
        row.className = "live-step";
        row.innerHTML = `<span class="dot"></span><span>${escapeHtml(task.agentName)}：${escapeHtml(task.instruction)}</span>`;
        steps.appendChild(row);
      });
    }
    return;
  }
  if (ev.type === "token") {
    const answer = document.getElementById("liveAnswer");
    if (answer) {
      answer.textContent += ev.text || "";
      answer.classList.add("streaming");
      const status = document.getElementById("liveStatus");
      if (status && /规划下一步|正在判断/.test(status.textContent || "")) {
        status.textContent = "正在输出结论…";
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    return;
  }
  if (ev.type === "answer_reset") {
    const answer = document.getElementById("liveAnswer");
    if (answer) answer.textContent = "";
    return;
  }
  if (ev.type === "paused") {
    paused = true;
    updatePauseBtn();
    liveThinking("general", "已暂停，当前步骤结束后等待继续");
    return;
  }
  if (ev.type === "resumed") {
    paused = false;
    updatePauseBtn();
    liveThinking("general", "已继续执行");
    return;
  }
  if (ev.type === "tool_start") { liveToolStart(ev); return; }
  if (ev.type === "tool_result") { liveToolResult(ev); return; }
  if (ev.type === "task") {
    if (live) {
      const body = live.querySelector(".body");
      if (body) {
        const card = document.createElement("div");
        card.className = "task-card";
        card.dataset.task = ev.task.task_id;
        card.innerHTML = `<div class="row"><span>后台任务</span><span class="task-status">排队中</span></div><div class="track"><div class="fill"></div></div><div class="result"></div>`;
        body.appendChild(card);
      }
    }
    return;
  }
}

async function send(clarificationAnswer = null, targetId = activeId) {
  // Browser click events are not answers. A structured answer must reference a
  // server-created question; the server remains authoritative for validation.
  const answering = clarificationAnswer && typeof clarificationAnswer.question_id === "string";
  const text = answering ? "" : inputEl.value.trim();
  if ((!answering && !text) || busy) return;
  if (!await refreshOwner() || busy) return;
  if (!activeSession()) createSession("新任务");
  const target = sessions.find(item => item.id === (answering ? targetId : activeId));
  if (!target) return;
  const question = answering ? target.clarifications?.find(item => item.id === clarificationAnswer.question_id) : null;
  if (answering && (!question || question.status !== "pending" || question.awaiting_ack)) return;
  const run = { sessionId:target.id, serverSessionId:target.sessionId || target.id, clarificationId:question?.id, epoch:ownerEpoch, controller:new AbortController(), finished:false };
  streamRun = run;
  target.status = "running";
  if (!answering) { inputEl.value = ""; inputEl.style.height = "auto"; }
  else { question.awaiting_ack = true; question.error = ""; }
  busy = true;
  sendEl.disabled = true;
  if (!answering) addUser(text);
  else { persistSessions(); renderSessions(); if (target.id === activeId) render(); }
  live = target.id === activeId ? startLive() : null;
  showPause();
  setActive("general");
  try {
    const response = await fetch("/api/v1/command/chat/stream", {
      method:"POST", credentials:"same-origin",
      headers:{"content-type":"application/json"},
      body: JSON.stringify({ messages: (target.history || []).slice(-14), session_id:run.serverSessionId, workspace_id:target.workspace || run.serverSessionId, ...(answering ? { clarification_answer:clarificationAnswer } : {}) }),
      signal:run.controller.signal,
    });
    if (run.epoch !== ownerEpoch) return;
    if (response.status === 401) { location.href = "/access?redirect=/"; return; }
    if (!response.ok || !response.body) {
      const data = await response.json().catch(() => ({}));
      if (question) {
        question.awaiting_ack = response.status === 409;
        question.error = response.status === 409 ? "该问题已被回答或正在处理，请先核验状态，不会重复提交。" : String((data.detail && (data.detail.message || data.detail)) || "回答暂未提交成功，已保留你的选择，请稍后重试。");
        target.status = "waiting_input";
        run.finished = true;
        persistSessions(); renderSessions();
        if (target.id === activeId) render();
      } else handleEvent({ type:"error", message:(data.detail && (data.detail.message || data.detail)) || "请求失败" }, run);
      return;
    }
    if (question) {
      question.status = "running";
      question.awaiting_ack = false;
      question.answer = { option_id:clarificationAnswer.option_id, text:clarificationAnswer.text };
      const option = (question.options || []).find(item => item.id === clarificationAnswer.option_id);
      const answerText = [option?.label, clarificationAnswer.text].filter(Boolean).join("；");
      target.messages.push({ role:"user", content:answerText });
      target.history.push({ role:"user", content:answerText });
      persistSessions();
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";
      for (const line of lines) {
        if (!line.trim()) continue;
        try { handleEvent(JSON.parse(line), run); } catch (e) { /* ignore malformed lines */ }
      }
    }
    if (buffer.trim()) {
      try { handleEvent(JSON.parse(buffer), run); } catch (e) { /* ignore malformed lines */ }
    }
    if (!run.finished) handleEvent({ type:"error", message:"连接中断，尚未确认最终结果；不会自动重发，请核对后台任务。" }, run);
  } catch (error) {
    if (run.epoch === ownerEpoch) handleEvent({ type:"error", message:"网络连接中断，尚未确认最终结果；不会自动重发，请核对后台任务。" }, run);
  } finally {
    if (run.epoch === ownerEpoch) {
      busy = false;
      streamRun = null;
      sendEl.disabled = !ownerScope;
      hidePause();
      bindActive(); render();
      if (question) {
        if (question.awaiting_ack) void restoreClarification(target, question);
      }
      inputEl.focus();
    }
  }
}

function loadDownloads() {
  try {
    const raw = JSON.parse(localStorage.getItem(DOWNLOAD_KEY) || "{}") || {};
    for (const [id, task] of Object.entries(raw)) {
      const status = String((task && task.status) || "").toLowerCase();
      const message = String((task && (task.error || task.message || task.detail)) || "");
      if (!task || /取数任务不存在|无权访问/i.test(message) || (!isTrackedTask(task) && (status === "failed" || /expired/i.test(message))) || status === "expired") {
        delete raw[id];
      } else {
        task.resume_pending = false;
        // A saved URL is not proof that the server still has a complete file.
        task.verified = false;
        if (isTrackedTask(task)) { task.url = ""; task.result = null; task.result_url = ""; }
      }
    }
    return raw;
  } catch (e) { return {}; }
}

function saveDownloads() {
  if (!ownerScope) return;
  try { localStorage.setItem(DOWNLOAD_KEY, JSON.stringify(downloads)); } catch (e) { /* ignore */ }
}

function formatBytes(bytes) {
  const value = Number(bytes || 0);
  if (value >= 1048576) return (value / 1048576).toFixed(2) + " MB";
  if (value >= 1024) return Math.round(value / 1024) + " KB";
  return value ? value + " B" : "";
}

function isEssayExport(task) {
  return String(task.task_id || "").startsWith("essay-export-") || String(task.poll_path || "").startsWith("/api/v1/financial-data/essays/package/tasks/");
}

function isDocumentExport(task) {
  return task?.document_export === true && /^acq-[A-Za-z0-9_-]{8,80}$/.test(String(task.task_id || ""));
}

function isPersistentExport(task) { return isEssayExport(task) || isDocumentExport(task); }

function isTrackedTask(task) {
  if (isPersistentExport(task)) return true;
  const id = String(task?.task_id || "");
  if (!/^[A-Za-z0-9_-]{4,100}$/.test(id)) return false;
  return ["/alphasift/screen/tasks/", "/analysis/tasks/", "/essay-quant/tasks/", "/industry-research/projects/",
    "/financial-data/research-notes/audio-analysis/tasks/", "/financial-data/research-notes/audio-files/batch-download-tasks/",
    "/data-acquisition/tasks/"].some(prefix => task.poll_path === `/api/v1${prefix}${id}${prefix === "/analysis/tasks/" ? "/flow" : ""}`);
}

function taskResultLink(task) {
  if (!task?.verified || !isTrackedTask(task) || task.status === "expired") return "";
  const id = encodeURIComponent(task.task_id), path = String(task.poll_path || ""), url = String(task.result_url || "");
  const valid = path.startsWith("/api/v1/industry-research/projects/") ? url === `/industry-research?project=${id}`
    : path.startsWith("/api/v1/essay-quant/tasks/") ? url === `/essay-quant?section=history&task=${id}` || /^\/essay-quant\?section=results&run=[1-9]\d*$/.test(url)
    : path.includes("/audio-analysis/tasks/") ? url === `/essay-radar/feed?tab=audio&task=${id}`
    : path.includes("/audio-files/batch-download-tasks/") && url === `/essay-radar/feed?tab=audio&package=${id}`;
  if (!valid) return "";
  return `<a class="dock-dl" href="${escapeHtml(url)}" target="_top">${["completed", "success", "done"].includes(task.status) ? "查看结果" : "查看任务"}</a>`;
}

function exportDownloadReady(task) {
  if (!isPersistentExport(task)) return !!task.verified && /^\/api\/v1\/[A-Za-z0-9/_?=&%.+-]+$/.test(String(task.url || ""));
  if (!task.verified || task.status !== "completed" || task.result?.complete !== true) return false;
  if (!isDocumentExport(task)) return !!task.url;
  return /^[A-Za-z0-9_-]+$/.test(String(task.job_id || "")) && task.url === `/api/v1/data-acquisition/jobs/${encodeURIComponent(task.job_id)}/download`;
}

function sessionExportIds(target) {
  return [...new Set((target?.messages || []).slice().reverse().flatMap(message =>
    (message.tasks || []).slice().reverse()).filter(isTrackedTask).map(task => task.task_id))].slice(0, 4);
}

function reconcileExportIds(ids) {
  if (!ownerScope) return;
  [...new Set(ids)].slice(0, 4).forEach(id => {
    if (downloads[id] && isTrackedTask(downloads[id])) pollDownload(id, true);
  });
}

function exportProgress(task) {
  if (task.progress === null || task.progress === undefined || task.progress === "" || !Number.isFinite(Number(task.progress))) return null;
  return Math.max(0, Math.min(100, Number(task.progress)));
}

function taskInProgress(task) {
  return !["completed", "done", "failed", "interrupted", "paused", "partial", "limited", "no_results", "expired", "success", "error", "cancelled", "canceled"].includes(task.status);
}

function taskStatusText(task) {
  const labels = { queued:"排队中", running:"后台执行中", processing:"后台处理中", indexing:"正在确定匹配范围", collecting:"正在读取原文", screening:"正在阅读全文判定主旨", packaging:"正在整理文件", retrying:"等待自动续跑", completed:"已完成", done:"已完成", success:"已完成", partial:"部分完成，需查看", limited:"受限，需处理", failed:"已中断", error:"执行失败", cancelled:"已取消", canceled:"已取消", interrupted:"已中断，可继续", paused:"等待继续", no_results:"未命中", expired:"已过期" };
  if (isPersistentExport(task) && task.status === "completed" && !exportDownloadReady(task)) return task.verified ? "结果文件未就绪" : "正在核验结果";
  return labels[task.status] || task.message || task.status || "处理中";
}

function exportDetails(task) {
  if (isDocumentExport(task)) {
    const count = value => value == null || !Number.isFinite(Number(value)) ? "统计中" : Number(value).toLocaleString("zh-CN");
    const sameError = task.error && task.message && String(task.error).trim() === String(task.message).trim();
    const breakpoint = task.checkpoint || task.resumable ? "断点已保存，成功文件不会重复下载。" : "内部按批次并发处理，不按批次拆分交付。";
    return `<div class="export-scope">一个需求 · 一个后台任务 · 最终一个资料包</div><div class="export-counts"><span>已入库 <b>${count(task.matched_total)}</b> 份</span><span>已下载 <b>${count(task.completed_files ?? 0)}</b> / ${count(task.total_files)} 份</span></div><div class="export-checkpoint">${escapeHtml(sameError ? task.error : (task.message || "正在确定完整范围"))}</div><div class="export-checkpoint">${breakpoint} ${escapeHtml(formatBytes(task.downloaded_bytes))}</div>`;
  }
  if (!isEssayExport(task)) return "";
  const count = value => value === null || value === undefined || !Number.isFinite(Number(value)) ? "统计中" : Number(value).toLocaleString("zh-CN");
  const focused = task.filters?.query_scope === "focused" || task.query_scope === "focused";
  const scope = focused ? task.requested_limit === null || task.requested_limit === undefined ? "主旨聚焦 · 导出全部整篇围绕公司的原文" : `主旨聚焦 · 全部候选筛选后最多导出 ${count(task.requested_limit)} 篇`
    : task.requested_limit === null || task.requested_limit === undefined ? "全部匹配结果 · 不设篇数上限" : `按你指定的 ${count(task.requested_limit)} 篇导出`;
  const checkpoint = task.checkpoint ? `<div class="export-checkpoint">断点已保存，继续时接着已读取的原文处理，不重新创建任务。</div>` : "";
  const bytes = Number(task.bytes_total) > 0 ? `${formatBytes(task.bytes_written)} / ${formatBytes(task.bytes_total)}` : formatBytes(task.bytes_written);
  const semantic = focused ? `<div class="export-checkpoint">AI只做全文主旨筛选，不生成新的小作文研判或转写。${task.focus_screening_complete ? "所有候选已判定，聚焦总数已确定。" : "聚焦总数与导出目标待全部候选筛选完成后确定；标题命中数不代表主旨聚焦篇数。"}</div><div class="export-counts"><span>检索候选 <b>${count(task.candidate_total)}</b> 条</span><span>已判定 <b>${count(task.screened_count ?? 0)}</b> 条</span><span>已确认聚焦 <b>${count(task.focused_count ?? 0)}</b> 篇</span><span>仅提及 <b>${count(task.mentioned_count ?? 0)}</b> 篇</span><span>不相关 <b>${count(task.irrelevant_count ?? 0)}</b> 篇</span><span>待核验 <b>${count(task.uncertain_count ?? 0)}</b> 篇</span></div>` : "";
  const sourceOnly = focused && Number(task.source_only_count) > 0 ? `<div class="export-checkpoint">仅源文件 ${count(task.source_only_count)} 条（附件正文未读取，未纳入文字聚焦包）</div>` : "";
  const target = focused && !task.focus_screening_complete ? "筛选后确定" : count(task.target_total) + " 篇";
  const matched = focused && !task.focus_screening_complete ? "待筛选完成" : count(task.matched_total) + " 篇";
  const retrieved = focused ? task.candidate_retrieved_count ?? task.retrieved_count : task.retrieved_count;
  return `<div class="export-scope">${escapeHtml(scope)}</div>${semantic}${sourceOnly}<div class="export-counts"><span>${focused ? "聚焦总数" : "匹配"} <b>${matched}</b></span><span>本次目标 <b>${target}</b></span><span>${focused ? "已读取候选" : "已读取"} <b>${count(retrieved ?? 0)}</b> ${focused ? "条" : "篇"}</span><span>已整理 <b>${count(task.packaged_count ?? 0)}</b> 篇</span></div>${bytes ? `<div class="export-checkpoint">已处理原始字节 ${escapeHtml(bytes)} · 下载大小以最终压缩包为准</div>` : ""}${checkpoint}`;
}

function exportActions(task) {
  if (isDocumentExport(task)) {
    return task.resumable && ["failed", "interrupted", "paused", "retrying"].includes(task.status)
      ? `<div class="export-actions"><button type="button" data-export-resume="${escapeHtml(task.task_id)}" ${task.resume_pending ? "disabled" : ""}>${task.resume_pending ? "正在核验并继续…" : "从断点继续"}</button></div>` : "";
  }
  if (!isEssayExport(task)) return "";
  const resume = task.resumable && ["failed", "retrying"].includes(task.status);
  const label = task.resume_pending ? "正在核验并继续…" : "从断点继续";
  const expectedReview = `/api/v1/financial-data/essays/package/tasks/${encodeURIComponent(task.task_id)}/focus-review`;
  const review = task.verified && task.focus_review_path === expectedReview
    ? `<a class="dock-dl" href="${escapeHtml(expectedReview)}" target="_blank" rel="noopener">查看主旨筛选依据</a>` : "";
  return resume || review ? `<div class="export-actions">${resume ? `<button type="button" data-export-resume="${escapeHtml(task.task_id)}" ${task.resume_pending ? "disabled" : ""}>${label}</button>` : ""}${review}</div>` : "";
}

function olderExportSnapshot(task, incoming) {
  const current = Date.parse(task.updated_at), next = Date.parse(incoming.updated_at);
  return Number.isFinite(current) && Number.isFinite(next) && next < current;
}

function exportErrorHtml(task) {
  const error = String(task.error || "").trim();
  if (!error || error === String(task.message || "").trim()) return "";
  return `<div class="export-checkpoint" role="status">${escapeHtml(error)}</div>`;
}

function exportLedgerHtml() {
  if (!ownerScope) return "";
  const tasks = Object.values(downloads).filter(isPersistentExport).sort((a, b) =>
    String(b.created_at || "").localeCompare(String(a.created_at || "")) || (b.created || 0) - (a.created || 0));
  const note = exportListMessage || (exportListCheck ? "正在核对账号的后台导出任务…" : tasks.length ? "来自当前账号的持久任务，可离开页面后回来查看。" : "当前账号暂无资料后台导出任务。");
  return `<div class="task-hint">资料后台导出 · ${escapeHtml(note)}</div>` + tasks.map(task => {
    const progress = exportProgress(task);
    const title = task.filename || task.title || (isDocumentExport(task) ? "公告与研报资料导出" : `${task.filters?.query || "全部匹配"} · 小作文导出`);
    const link = exportDownloadReady(task) ? `<a class="dock-dl" href="${escapeHtml(task.url)}" download>下载 ZIP</a>` : "";
    return `<div class="task-row" data-export-record="${escapeHtml(task.task_id)}"><div class="task-row-head"><span class="task-title">${escapeHtml(title)}</span><span class="task-status">${escapeHtml(taskStatusText(task))}${progress === null ? "" : ` ${progress}%`}</span></div>${exportDetails(task)}${exportErrorHtml(task)}<div class="task-actions"><button type="button" data-export-view="${escapeHtml(task.task_id)}">查看任务</button>${link}</div>${exportActions(task)}</div>`;
  }).join("");
}

function refreshEssayExports() {
  if (!ownerScope) return Promise.resolve();
  if (exportListCheck) return exportListCheck.promise;
  const check = { epoch:ownerEpoch, controller:new AbortController(), promise:null };
  exportListCheck = check;
  exportListMessage = "";
  renderManagedTasks(); renderWorkspaceFiles();
  check.promise = (async () => {
    try {
      // Each source is owner-scoped. A temporary failure in one list must not
      // hide the other source's tasks or discard saved checkpoints.
      const sources = ["/api/v1/financial-data/essays/package/tasks", "/api/v1/data-acquisition/tasks"];
      const lists = await Promise.allSettled(sources.map(async path => {
        const response = await fetch(path, { credentials:"same-origin", cache:"no-store", signal:check.controller.signal });
        const data = await response.json();
        if (!response.ok || !Array.isArray(data.items)) throw new Error("任务列表暂时无法核验");
        return data.items;
      }));
      if (check.epoch !== ownerEpoch || exportListCheck !== check) return;
      if (lists.some(list => list.status === "rejected")) exportListMessage = "部分后台任务列表暂未更新，已保留已有任务与断点。";
      for (const [sourceIndex, list] of lists.entries()) {
       if (list.status !== "fulfilled") continue;
       for (const record of list.value) {
        if (!record || (sourceIndex === 0 ? !isEssayExport(record) : !isDocumentExport(record))) continue;
        const id = record.task_id;
        const path = sourceIndex === 0 ? `/api/v1/financial-data/essays/package/tasks/${encodeURIComponent(id)}` : `/api/v1/data-acquisition/tasks/${encodeURIComponent(id)}`;
        const existing = downloads[id] || {};
        if (olderExportSnapshot(existing, record)) continue;
        const task = Object.assign(existing, record, {
          poll_path:path, verified:true, created:existing.created || Date.parse(record.created_at) || Date.now(),
          resume_pending:!!existing.resume_pending,
          status:String(record.status || "queued").toLowerCase(), url:"",
        });
        const expectedDownload = isDocumentExport(task) && /^[A-Za-z0-9_-]{8,80}$/.test(String(task.job_id || ""))
          ? `/api/v1/data-acquisition/jobs/${task.job_id}/download` : path + "/download";
        if (task.status === "completed" && record.result?.complete === true && record.result.download_url === expectedDownload) {
          task.url = record.result.download_url;
          task.filename = record.result.filename;
          task.size = record.result.size;
        }
        downloads[id] = task;
        syncExportReferences(task);
        pollDownload(id);
       }
      }
      // A missing list item is not permission to delete a locally saved task.
      saveDownloads();
    } catch (error) {
      if (check.epoch !== ownerEpoch || exportListCheck !== check) return;
      exportListMessage = "后台任务列表暂未更新，已保留已有任务与断点；重新打开文件或任务即可核验。";
    } finally {
      if (check.epoch === ownerEpoch && exportListCheck === check) {
        exportListCheck = null;
        renderDock(); renderManagedTasks(); renderWorkspaceFiles(); renderSessions(); syncMeetingStatus();
      }
    }
  })();
  return check.promise;
}

function renderDock() {
  const dock = document.getElementById("downloadDock");
  const itemsEl = document.getElementById("dockItems");
  if (!dock || !itemsEl) return;
  const list = Object.values(downloads)
    .filter(item => !item.hidden_from_dock)
    .sort((a, b) => (b.created || 0) - (a.created || 0))
    .slice(0, 4);
  dock.hidden = list.length === 0;
  itemsEl.innerHTML = list.map((item) => {
    const progress = exportProgress(item);
    const title = item.filename || item.title || (isEssayExport(item) ? "小作文原文导出" : "后台任务");
    const status = taskStatusText(item);
    const size = formatBytes(item.size);
    const link = exportDownloadReady(item) ? `<a class="dock-dl" href="${escapeHtml(item.url)}" download>下载 ZIP</a>` : "";
    return `<div class="dock-item">
      <div class="dock-title">${escapeHtml(title)}</div>
      <div class="dock-track${progress === null && taskInProgress(item) ? " indeterminate" : ""}" role="progressbar" aria-label="${escapeHtml(title)}" ${progress === null ? "" : `aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100"`}><i style="${progress === null ? "" : `width:${progress}%`}"></i></div>
      <div class="dock-meta"><span>${escapeHtml(status)}${progress === null ? "" : ` · ${progress}%`}</span><span>${escapeHtml(size)}</span></div>
      ${exportDetails(item)}${exportErrorHtml(item)}${exportActions(item)}${link}${taskResultLink(item)}
    </div>`;
  }).join("");
}

function renderTaskCards(task) {
  document.querySelectorAll(`.task-card[data-task="${CSS.escape(task.task_id)}"]`).forEach(card => {
    const progress = exportProgress(task);
    card.querySelector(".task-status").textContent = `${taskStatusText(task)}${progress === null ? "" : ` ${progress}%`}`;
    const track = card.querySelector(".track");
    track.classList.toggle("indeterminate", progress === null && taskInProgress(task));
    track.setAttribute("role", "progressbar");
    track.setAttribute("aria-label", "后台任务进度");
    if (progress === null) track.removeAttribute("aria-valuenow");
    else { track.setAttribute("aria-valuenow", String(progress)); track.setAttribute("aria-valuemin", "0"); track.setAttribute("aria-valuemax", "100"); }
    card.querySelector(".fill").style.width = progress === null ? "" : progress + "%";
    let details = card.querySelector(".export-details");
    if (!details) { details = document.createElement("div"); details.className = "export-details"; card.appendChild(details); }
    details.innerHTML = exportDetails(task) + exportActions(task);
    const result = card.querySelector(".result");
    if (exportDownloadReady(task)) result.innerHTML = `<a class="dock-dl" href="${escapeHtml(task.url)}" download>下载 ${escapeHtml(task.filename || "结果")}</a>`;
    else if (taskResultLink(task)) result.innerHTML = taskResultLink(task);
    else if (isDocumentExport(task) || isEssayExport(task)) result.textContent = "";
    else result.textContent = task.error || task.message || "";
  });
}

function syncExportReferences(task) {
  if (!isTrackedTask(task)) return;
  for (const session of sessions) {
    for (const message of session.messages || []) {
      for (const reference of message.tasks || []) {
        if (reference.task_id === task.task_id) Object.assign(reference, task);
      }
    }
  }
  persistSessions();
}

function pollDownload(taskId, verify = false) {
  const task = downloads[taskId];
  if (!ownerScope || !task) return;
  renderTaskCards(task);
  if ((!verify && !taskInProgress(task)) || taskPollers.has(taskId)) return;
  const poller = { epoch:ownerEpoch, timer:null, controller:new AbortController() };
  taskPollers.set(taskId, poller);
  const current = () => poller.epoch === ownerEpoch && taskPollers.get(taskId) === poller;
  const tick = async () => {
    let delay = 3000;
    try {
      const url = `/api/v1/command/task?task_id=${encodeURIComponent(taskId)}&poll_path=${encodeURIComponent(task.poll_path || "")}`;
      const response = await fetch(url, { credentials:"same-origin", signal:poller.controller.signal });
      const data = await response.json();
      if (!current()) return;
      const status = Number(data.ok === false ? data.status : response.status);
      const inner = data.data || data;
      if (status === 404 || status === 403) {
        delete downloads[taskId];
        task.url = ""; task.result_url = "";
        task.error = "任务不存在或无权访问";
        task.status = "failed";
        task.verified = true;
      } else if (status === 401) {
        task.url = ""; task.result_url = "";
        task.error = "登录已过期，请重新登录后核对任务";
        task.status = "failed";
        task.verified = true;
      } else if (status >= 400 || data.ok === false) {
        throw new Error("状态读取暂时失败，保留最近进度");
      } else if (!isEssayExport(task) || !olderExportSnapshot(task, inner)) {
        task.status = String(inner.status || inner.state || task.status || "processing").toLowerCase();
        if (inner.updated_at) task.updated_at = inner.updated_at;
        task.title = inner.title || task.title;
        task.progress = Object.hasOwn(inner, "progress") ? inner.progress : (task.progress ?? null);
        task.message = inner.message || task.message;
        task.error = inner.error ? String(inner.error).slice(0, 200) : "";
        task.verified = true;
        if (!isPersistentExport(task)) task.result_url = data.task?.task_id === taskId && data.task?.poll_path === task.poll_path ? data.task.result_url || "" : "";
        if (inner.document_export === true) task.document_export = true;
        if (isDocumentExport(task)) {
          for (const key of ["phase", "job_id", "matched_total", "total_files", "completed_files", "downloaded_bytes", "checkpoint", "resumable", "resume_path"]) {
            if (Object.hasOwn(inner, key)) task[key] = inner[key];
          }
          task.url = "";
          task.result = inner.result || null;
        }
        if (isEssayExport(task)) {
          for (const key of ["phase", "filters", "matched_total", "requested_limit", "target_total", "retrieved_count", "candidate_retrieved_count", "packaged_count", "bytes_written", "bytes_total", "checkpoint", "resumable", "candidate_total", "screened_count", "focused_count", "mentioned_count", "irrelevant_count", "uncertain_count", "source_only_count", "focus_screening_complete", "focus_review_path"]) {
            if (Object.hasOwn(inner, key)) task[key] = inner[key];
          }
          task.result = inner.result || null;
          task.url = "";
        }
        if (inner.result) {
          task.title = inner.result.title || task.title;
          task.filename = inner.result.filename || task.filename;
          task.size = inner.result.size || task.size;
          if (!isPersistentExport(task) || (task.status === "completed" && inner.result.complete === true)) task.url = inner.result.download_url || task.url;
        }
        // Preserve the existing cleanup of inaccessible/expired acquisition tasks.
        if (/取数任务不存在|无权访问|data_acquisition_error/.test(`${task.error || ""} ${inner.message || ""}`)) {
          delete downloads[taskId];
          task.status = "failed";
        }
      }
    } catch (error) {
      if (!current()) return;
      task.error = "状态暂未更新，保留最近进度并自动重试";
      delay = 5000;
    }
    if (!current()) return;
    const signature = [task.status, task.progress, task.message, task.error, task.matched_total, task.completed_files, task.phase, task.checkpoint].join("|");
    const unchanged = poller.signature === signature;
    poller.signature = signature;
    syncExportReferences(task);
    if (!unchanged) {
      saveDownloads(); renderDock(); renderTaskCards(task); renderSessions(); syncMeetingStatus(); renderManagedTasks(); renderWorkspaceFiles();
    }
    if (!downloads[taskId] || !taskInProgress(task)) taskPollers.delete(taskId);
    else poller.timer = setTimeout(tick, delay);
  };
  void tick();
}

function registerDownloadTask(task) {
  if (!ownerScope || !task || !task.task_id) return;
  const isNew = !downloads[task.task_id];
  if (isNew) {
    downloads[task.task_id] = {
      task_id: task.task_id,
      poll_path: task.poll_path,
      ...task,
      title: task.title || (isEssayExport(task) ? "小作文原文导出" : "后台任务"),
      status: task.status || "processing",
      progress: task.progress ?? null,
      message: "排队中",
      created: Date.now(),
    };
    if (isTrackedTask(task)) { downloads[task.task_id].url = ""; downloads[task.task_id].result_url = ""; downloads[task.task_id].verified = false; }
    saveDownloads();
    renderDock();
  }
  // A previous failed state stopped polling, but another client or the Agent
  // can resume this same server job. Re-registration must GET its true state.
  pollDownload(task.task_id, isTrackedTask(task));
}

async function resumeExportTask(taskId) {
  const task = downloads[taskId];
  if (!task || !isPersistentExport(task) || task.resume_pending || !task.resumable || !["failed", "retrying", "interrupted", "paused"].includes(task.status)) return;
  const expectedPath = isDocumentExport(task) ? `/api/v1/data-acquisition/tasks/${encodeURIComponent(taskId)}` : `/api/v1/financial-data/essays/package/tasks/${encodeURIComponent(taskId)}`;
  if (task.poll_path !== expectedPath) { task.error = "任务地址不匹配，请核验原任务。"; renderDock(); renderTaskCards(task); return; }
  if (!await refreshOwner() || downloads[taskId] !== task || task.resume_pending) return;
  const epoch = ownerEpoch;
  task.resume_pending = true;
  renderDock(); renderTaskCards(task); renderManagedTasks(); renderWorkspaceFiles();
  try {
    const response = await fetch(expectedPath + "/resume", { method:"POST", credentials:"same-origin", headers:{"content-type":"application/json"}, body:"{}" });
    if (epoch !== ownerEpoch || downloads[taskId] !== task) return;
    if (!response.ok) throw new Error("暂未能继续，请核验任务后重试");
    task.status = "queued";
    task.message = "已请求从断点继续";
    task.error = "";
  } catch (error) {
    if (epoch !== ownerEpoch || downloads[taskId] !== task) return;
    task.error = "继续请求状态未确认，正在核验原任务；不会自动重复提交。";
  } finally {
    if (epoch === ownerEpoch && downloads[taskId] === task) {
      task.resume_pending = false;
      saveDownloads(); renderDock(); renderTaskCards(task); renderManagedTasks(); renderWorkspaceFiles();
      // GET reconciles an uncertain response; only a user click may POST again.
      pollDownload(taskId, true);
    }
  }
}

function startTaskPolling(task) {
  if (!task || !task.task_id) return;
  registerDownloadTask(task);
}

function openExportTask(taskId) {
  const documentExport = /^acq-[A-Za-z0-9_-]{8,80}$/.test(taskId);
  if (!ownerScope || (!documentExport && !/^essay-export-[a-zA-Z0-9-]{1,100}$/.test(taskId))) return;
  let target = sessions.find(session => (session.messages || []).some(message => (message.tasks || []).some(task => task.task_id === taskId)));
  const task = { task_id:taskId, ...(documentExport ? {document_export:true} : {}),
    poll_path:documentExport ? `/api/v1/data-acquisition/tasks/${encodeURIComponent(taskId)}` : `/api/v1/financial-data/essays/package/tasks/${encodeURIComponent(taskId)}` };
  if (!target) {
    target = createSession(documentExport ? "资料后台导出" : "小作文后台导出");
    target.status = "submitted";
    target.messages.push({ role:"assistant", agent:"data", content:"正在读取这项后台导出任务的当前状态。不会重新创建或提交任务。", tasks:[task] });
    persistSessions();
  } else activeId = target.id;
  bindActive(); render(); renderSessions();
  registerDownloadTask(task);
  pollDownload(taskId, true);
}

function restoreLinkedExport() {
  openExportTask(new URLSearchParams(window.location.search).get("export_task") || "");
}

inputEl.addEventListener("keydown", event => {

let navCompact = localStorage.getItem("leziwu.navCompact") === "1";

function applyNavCompact(on) {
  try {
    const parentDoc = window.parent && window.parent.document;
    if (!parentDoc) return;
    const existing = parentDoc.getElementById("alterdo-nav-compact");
    if (!on) { if (existing) existing.remove(); localStorage.setItem("leziwu.navCompact", "0"); return; }
    if (existing) { localStorage.setItem("leziwu.navCompact", "1"); return; }
    const style = parentDoc.createElement("style");
    style.id = "alterdo-nav-compact";
    style.textContent = `
      .research-sidebar { width:64px !important; min-width:64px !important; max-width:64px !important; }
      .research-sidebar nav a { justify-content:center !important; padding-left:0 !important; padding-right:0 !important; }
      .research-sidebar nav a > :not(svg) { display:none !important; }
      .research-sidebar nav a svg { margin:0 auto !important; }
    `;
    parentDoc.head.appendChild(style);
    localStorage.setItem("leziwu.navCompact", "1");
  } catch (error) { /* cross-origin or unavailable */ }
}

function compactSiteNav() {
  applyNavCompact(navCompact);
}

function renameParentNav() {
  try {
    const parentDoc = window.parent && window.parent.document;
    if (!parentDoc) return;
    const walker = parentDoc.createTreeWalker(parentDoc.body, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      if (node.nodeValue && node.nodeValue.trim() === "投资会议") node.nodeValue = "智能投研团队";
    }
    if (parentDoc.title && parentDoc.title.includes("投资会议")) {
      parentDoc.title = parentDoc.title.replace("投资会议", "智能投研团队");
    }
  } catch (error) { /* cross-origin or unavailable */ }
}

function renderWorkspaceFiles() {
  const panel = document.getElementById("wsFiles");
  const list = document.getElementById("wsFilesList");
  if (!workspaceFilesView || !panel || panel.hidden || !list) return;
  const view = workspaceFilesView;
  const body = view.error ? `<div class="export-checkpoint">工作区文件暂未读取，后台导出任务仍可查看。</div>` : view.items === null ? `<div class="export-checkpoint">正在读取工作区文件…</div>` : view.items.length ? view.items.map(item => `
      <a class="ws-file" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">
        ${escapeHtml(item.filename)}
        <span>${(Number(item.size || 0) / 1024).toFixed(1)} KB</span>
      </a>`).join("") : `<div class="export-checkpoint">当前工作区暂无可访问的文件。未归属的旧资料不会自动划入当前账号。</div>`;
  list.innerHTML = exportLedgerHtml() + `<div class="task-hint">当前工作区文件</div>` + body;
}

async function openWorkspaceFiles(workspace, title) {
  if (!await refreshOwner()) return;
  const epoch = ownerEpoch;
  const panel = document.getElementById("wsFiles");
  const list = document.getElementById("wsFilesList");
  const label = document.getElementById("wsFilesTitle");
  if (!panel || !list) return;
  label.textContent = `${title || "工作区文件"} · ${workspace}`;
  panel.hidden = false;
  const view = { workspace, items:null, error:false };
  workspaceFilesView = view;
  renderWorkspaceFiles();
  void refreshEssayExports();
  try {
    const response = await fetch(`/api/v1/financial-data/workspace-files?workspace=${encodeURIComponent(workspace)}`, { credentials: "same-origin" });
    const data = await response.json();
    if (epoch !== ownerEpoch || workspaceFilesView !== view) return;
    if (!response.ok) throw new Error("读取失败");
    if (!Array.isArray(data.items)) throw new Error("文件列表无效");
    view.items = data.items;
    renderWorkspaceFiles();
  } catch (error) {
    if (epoch !== ownerEpoch || workspaceFilesView !== view) return;
    view.error = true;
    renderWorkspaceFiles();
  }
}

function boot() {
  sendEl.disabled = true;
  document.getElementById("taskStart").disabled = true;
  messagesEl.textContent = "正在确认登录身份…";
  const newBtn = document.getElementById("newSessionBtn");
  if (newBtn) newBtn.addEventListener("click", newSession);
  const search = document.getElementById("sessionSearch");
  if (search) search.addEventListener("input", renderSessions);
  const filters = document.getElementById("sessionFilters");
  if (filters) filters.addEventListener("click", (event) => {
    const btn = event.target.closest("button[data-status]");
    if (!btn) return;
    sessionFilter = btn.dataset.status || "";
    filters.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
    renderSessions();
  });
  compactSiteNav();
  renameParentNav();
  const navToggle = document.getElementById("navToggle");
  if (navToggle) navToggle.addEventListener("click", () => { navCompact = !navCompact; applyNavCompact(navCompact); });
  const filesBtn = document.getElementById("filesBtn");
  if (filesBtn) filesBtn.addEventListener("click", () => { const s = activeSession(); openWorkspaceFiles((s && s.workspace) || "default", (s && s.title) || "工作区文件"); });
  const filesClose = document.getElementById("wsFilesClose");
  if (filesClose) filesClose.addEventListener("click", () => { document.getElementById("wsFiles").hidden = true; });
  document.getElementById("wsFilesList")?.addEventListener("click", event => {
    const resume = event.target.closest("[data-export-resume]");
    if (resume) { void resumeExportTask(resume.dataset.exportResume); return; }
    const view = event.target.closest("[data-export-view]");
    if (view) { openExportTask(view.dataset.exportView); document.getElementById("wsFiles").hidden = true; }
  });
  buildRoom();
  syncSeatExtras();
  renderBoard((activeSession() && activeSession().lastWidgets) || []);
  render();
  renderDock();
  const pauseButton = document.getElementById("pauseBtn");
  if (pauseButton) pauseButton.addEventListener("click", togglePause);
  const taskButton = document.getElementById("taskBtn");
  if (taskButton) taskButton.addEventListener("click", openTaskManager);
  const sessionToggle = document.getElementById("sessionToggle");
  if (sessionToggle) sessionToggle.addEventListener("click", () => document.querySelector(".sessions")?.classList.toggle("is-open"));
  const taskClose = document.getElementById("taskClose");
  if (taskClose) taskClose.addEventListener("click", closeTaskManager);
  const taskStart = document.getElementById("taskStart");
  if (taskStart) taskStart.addEventListener("click", startManagedTask);
  const taskInput = document.getElementById("taskInput");
  if (taskInput) taskInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); startManagedTask(); }
  });
  const taskList = document.getElementById("taskList");
  if (taskList) taskList.addEventListener("click", event => {
    const resume = event.target.closest("[data-export-resume]");
    if (resume) { void resumeExportTask(resume.dataset.exportResume); return; }
    const exportView = event.target.closest("[data-export-view]");
    if (exportView) { openExportTask(exportView.dataset.exportView); closeTaskManager(); return; }
    const pause = event.target.closest("[data-task-pause]");
    if (pause) { toggleManagedPause(pause.dataset.taskPause); return; }
    const view = event.target.closest("[data-task-view]");
    if (view) viewManagedTask(view.dataset.taskView);
  });
  messagesEl.addEventListener("change", event => {
    const card = event.target.closest("[data-clarification]");
    const question = activeSession()?.clarifications?.find(item => item.id === card?.dataset.clarification);
    if (!question || event.target.type !== "radio") return;
    question.selected = event.target.value;
    question.error = "";
    persistSessions();
  });
  messagesEl.addEventListener("input", event => {
    const card = event.target.closest("[data-clarification]");
    const question = activeSession()?.clarifications?.find(item => item.id === card?.dataset.clarification);
    if (!question || event.target.tagName !== "TEXTAREA") return;
    question.draft = event.target.value;
    persistSessions();
  });
  messagesEl.addEventListener("click", event => {
    const resume = event.target.closest("[data-export-resume]");
    if (resume) { void resumeExportTask(resume.dataset.exportResume); return; }
    const card = event.target.closest("[data-clarification]");
    if (!card) return;
    if (event.target.closest("[data-clarification-submit]")) void submitClarification(card.dataset.clarification);
    if (event.target.closest("[data-clarification-refresh]")) {
      const target = activeSession();
      const question = target?.clarifications?.find(item => item.id === card.dataset.clarification);
      if (question) void restoreClarification(target, question);
    }
  });
  document.getElementById("dockItems")?.addEventListener("click", event => {
    const resume = event.target.closest("[data-export-resume]");
    if (resume) void resumeExportTask(resume.dataset.exportResume);
  });
  const clear = document.getElementById("dockClear");
  if (clear) clear.addEventListener("click", () => {
    Object.keys(downloads).forEach((taskId) => {
      const task = downloads[taskId];
      if (["completed", "no_results", "failed", "expired"].includes(String(task.status || "").toLowerCase()) && !(isPersistentExport(task) && task.resumable && task.status === "failed")) {
        if (isPersistentExport(task)) task.hidden_from_dock = true;
        else delete downloads[taskId];
      }
    });
    saveDownloads();
    renderDock();
  });
  setActive("general");
  return refreshOwner().then(ready => { if (ready) restoreLinkedExport(); return ready; });
}
function refreshVisibleOwner() {
  if (document.visibilityState === "hidden") return;
  void refreshOwner().then(ready => {
    if (!ready) return;
    const visibleDock = Object.values(downloads).filter(task => !task.hidden_from_dock)
      .sort((a, b) => (b.created || 0) - (a.created || 0)).slice(0, 4)
      .filter(isTrackedTask).map(task => task.task_id);
    reconcileExportIds([...sessionExportIds(activeSession()), ...visibleDock]);
  });
}
function disposeMeeting() {
  ownerEpoch++;
  streamRun?.controller.abort();
  stopTaskPollers();
  exportListCheck?.controller.abort();
  exportListCheck = null;
  clarificationChecks.forEach(check => check.controller.abort());
  clarificationChecks.clear();
  clearInterval(taskTimer);
  window.removeEventListener("focus", refreshVisibleOwner);
  document.removeEventListener("visibilitychange", refreshVisibleOwner);
  window.removeEventListener("pagehide", disposeMeeting);
}
window.addEventListener("focus", refreshVisibleOwner);
document.addEventListener("visibilitychange", refreshVisibleOwner);
window.addEventListener("pagehide", disposeMeeting);
const meetingReady = boot();
</script>
</body>
